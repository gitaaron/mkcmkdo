# SportCam development environment.
#
#   docker compose up -d workspace     # build image + start idle workspace
#   docker compose exec workspace bash # shell with node/openscad/python ready
#
# Used by sbx_run_claude.sh: the workspace service keeps running so the
# sandbox/agent can exec into it; the repo is bind-mounted at /workspace and
# node_modules are installed on first start.
#
# Common tasks inside the workspace:
#   npm run dev                        # Firebase emulators + simulated camera
#   npm run docs                       # docs viewer :8090
#   (BUILD = with_uwb or without_uwb)
#   ./BUILD/cad/render_all.sh                    # OpenSCAD → BUILD/cad/stl/*.stl
#   python3 BUILD/cad/render_previews.py         # STL previews → docs/BUILD/images/parts/
#   python3 BUILD/schematics/render_diagrams.py  # design diagrams → docs/BUILD/images/
#   python3 BUILD/schematics/render_schematics.py  # schematics → docs/BUILD/images/

services:
  workspace:
    build: .
    image: sportcam-dev
    volumes:
      - .:/workspace
      # keep container node_modules off the host mount (and vice versa)
      - node_modules:/workspace/node_modules
      # emulator downloads (Firestore/Storage jars), kept between restarts
      - firebase_cache:/root/.cache/firebase
    working_dir: /workspace
    environment:
      # with_uwb | without_uwb — which build the simulated camera is
      TRACKING_MODE: ${TRACKING_MODE:-with_uwb}
      # pass the host's proxy config through (empty/no-op on proxy-less hosts;
      # needed when the host routes egress via a proxy, e.g. Docker sandboxes)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    ports:
      - "5001:5001"   # functions emulator (the API)
      - "8080:8080"   # Firestore emulator
      - "9199:9199"   # Storage emulator
      - "4000:4000"   # emulator UI
      - "8090:8090"   # docs viewer
    # `;` not `&&` — the workspace must stay up even if the initial install
    # fails (e.g. no network); just rerun `npm install` inside.
    command: >-
      bash -lc "npm install --no-audit --no-fund
      || echo 'npm install failed — rerun npm install inside the workspace';
      exec sleep infinity"

volumes:
  node_modules:
  firebase_cache:
