<script>
/* =====================================================================
   Assembly data. Coordinates are OpenSCAD-space millimetres, matching
   cad/config.scad (Z up, lens axis +X, tilt axis Y).
   ===================================================================== */
// The layout cad/fit.py solved from the part sizes (layout.js, generated).
const LY = window.SPORTCAM_LAYOUT;
const LID_Z = LY.lid_z;           // lid ring drops into the enclosure mouth
const LID_TOP = LY.lid_top;       // top face of the lid — the PTZ base bolts here
const PTZ_Z = LY.ptz_z;           // underside of the Arducam base's bottom disc, on its standoffs
const TILT_Z = LY.tilt_z;         // tilt axis of the Arducam base
const PTZ = LY.parts.ptz;         // its measured sizes, from cad/ordered_parts.toml
const SHELF_Z = LY.shelf_z;       // underside of the Pi shelf
const BAND_Z = LY.window_z - LY.design.diffuser_lip;   // bottom of the diffuser band
const ARM_R = LY.arm_boss_r;       // drum wall boss the anchor arms bolt to
const MAST_R = LY.mast_axis_r;    // A3 mast axis behind the pan axis, at −X
const UWB_HALF = LY.uwb.uwb_half_base;   // A1/A2 board centres either side of the pan axis
const ARM_Z = LY.drum_z + LY.uwb.arm_boss_z;   // the arms' root plates, on the drum's bosses
const BOARD_Z = LY.anchor_z;               // A1/A2 board height
const DOWEL_Z0 = ARM_Z + LY.uwb.mast_floor;
const MAST_TOP = DOWEL_Z0 + LY.dowel_l;  // dowel top
const A3_Z = BOARD_Z + LY.uwb.uwb_v_base;    // A3 board, uwb_v_base above A1/A2
// where a wall feature is, in words: +X is the lens, +Y is on your left behind the camera
const where = (a) => ["front", "front-left", "left side", "back-left", "back", "back-right", "right side", "front-right"][Math.round((((a % 360) + 360) % 360) / 45) % 8];
const bx = (k) => LY.boxes[k];
const polarXY = (r, a) => [r * Math.cos(a * Math.PI / 180), r * Math.sin(a * Math.PI / 180)];

const PHASES = ["Prepare", "Enclosure", "Camera", "Tracking", "Finish"];

// part groups, in assembly order
const SHELL = ["base_housing", "power_drum", "bank_plate", "insert"];
const POWER = ["trigger", "switch", "latch", "buck", ...(LY.shifter_on === "deck" ? ["shifter"] : [])];
const SHELF = ["shelf", "ledring", ...(LY.shifter_on === "shelf" ? ["shifter"] : [])];
const PI = ["pi", "cooler"];
const LED = ["led_diffuser_ring"];
const HEAD = ["lid", "ptz_plate", "ptz_pan", "ptz_yoke", "camera", "lens"];
const ARMS = ["arm_p", "arm_n", "uwb_p", "uwb_n"];
const MAST = ["mast_foot", "dowel", "mast_cradle", "uwb_m"];
const BATT = ["bank"];
const CABLES = ["ffc", "usb_p", "usb_n", "usb_m", "wiring", "bank_cable"];
const lift = (ids, dz) => ids.map((id) => [id, 0, 0, dz]);

const STEPS = [
  {
    id: "prep", phase: 0, title: "Print, measure and prepare the parts", time: "≈ 55 h print · 60 min prep",
    parts: ["All 10 printed bodies (≈ 530 g PETG) — settings and filament in <a href='../../../setup/11-3d-printing.md' target='_blank'>printer specifications</a>", "M2.5 / M3 screw kit + brass heat-set inserts", "Calipers"],
    tools: ["3D printer", "Calipers", "Soldering iron (for inserts)", "3.2 mm drill bit, flush cutters"],
    steps: [
      "<b>Measure before printing.</b> Measure what you've bought and put the numbers in <code>cad/ordered_parts.toml</code> — above all the Arducam base's <b>standoff spacing</b> (the lid's slots take 70–104 mm), the power bank, the buck converter, and your ULA1 boards. Then run <code>python3 cad/fit.py</code> from <code>sport_cam/</code>: it works out where everything goes, re-renders the parts and checks that they all fit together and print on an A1 Mini. This guide follows its layout. The full list is in the <a href='../15-verification.md' target='_blank'>verification checklist</a>.",
      "<b>Print:</b> enclosure — PETG, 4 walls, 20 %, no supports · <b>lid — 5 walls, 40 %</b>, it carries the whole camera · shelf — 3 walls, 20 %, white or natural if you have it · diffuser band — white PETG, 2 walls, 0 % infill · anchor arms ×2 — flat, 4+ walls · mast foot and mast cradle — socket up, 4+ walls · power drum — 4 walls, 25 %, floor down · bank plate — 3 walls, 40 %, flat · wearable pod — 2 walls, 20 %.",
      "<b>Clean up.</b> Remove brims, run a 3.2 mm drill through every M3 clearance hole, and check the lid's slots and its cable slot are clear.",
      "<b>Dry-fit</b> the lid ring in the enclosure mouth, the shelf on its three posts, the diffuser band over the window, an arm on each side boss, the mast foot on the back boss, the dowel in both sockets, and the bank on its plate in the drum's pocket (it should slide in and click).",
      `<b>Heat-set inserts</b> (M3, ${13 + LY.drum.screws.length} in all, and 2 more in the bank plate in the next step): 2 in each of the three bosses on the drum wall for the arm and mast-foot bolts, 1 in the side of each mast socket for its pinch screw, 1 in the top of each shelf post, 4 pushed in sideways into the lid's ring, lined up with the holes in the wall, and 1 in the top of each of the drum's ${LY.drum.screws.length} posts.`,
      `<b>Cut the dowel</b> to <b>${Math.round(LY.dowel_l)} mm</b> — a ½-inch (12.7 mm) hardwood dowel, square-ended. That length puts A3 exactly 250 mm above A1 and A2; <code>cad/anchor_mast.scad</code> prints the figure if you change <code>uwb_v_base</code>.`,
    ],
    note: "The layout is solved, not drawn: if a part you measure is bigger than assumed, <code>cad/fit.py</code> moves things around — or makes the enclosure taller or wider, up to what the A1 Mini can print — and this guide follows. <code>cad/FIT_REPORT.md</code> says what it checked.",
    scene: {
      show: [], arrows: false, focus: "all", stay: true,
      add: [["base_housing", 0, 0, 0], ["shelf", 0, 0, 60], ["led_diffuser_ring", 0, 0, 105],
            ["lid", 0, 0, 160], ["arm_p", 0, 0, 60], ["arm_n", 0, 0, 60],
            ["mast_foot", -60, 0, 0], ["mast_cradle", -60, 0, -80],
            ["power_drum", 0, 0, -70], ["bank_plate", 0, 0, -150]],
      view: "iso", render: "prep",
    },
  },
  {
    id: "tripod-insert", phase: 1, title: "Tripod nut into the bank plate", time: "10 min + cure",
    parts: ["Bank plate", "3/8-16 hex nut", "3/8-16 → 1/4-20 reducer bushing", "2-part epoxy", "2 × M3 heat-set inserts"],
    tools: ["Soldering iron (for the inserts)", "3/8-16 screw as a plug", "Flat screwdriver (for the bushing's slot)"],
    steps: [
      "The tripod screws into the <b>power drum</b> under the enclosure: the stack is tripod → drum → enclosure. The nut sits in a hex hole through the <b>bank plate</b>, the flat part the bank slides in on, which drops into the bottom of the drum's bank pocket; the tripod screw comes up through a 10 mm hole in the drum floor and pulls the nut down onto it. The plate only stops the nut turning.",
      "Turn the plate over and press the two M3 heat-set inserts into the holes in its underside. Two screws up through the drum floor hold it in later.",
      "Lay the plate flat, top up. Butter the six sides of the nut with epoxy and press it into the hex hole until it is flush with the underside: nothing may stand proud of the top or the bank catches on it, and nothing below or the plate won't sit flat. A lightly greased 3/8-16 screw through it keeps the threads clean.",
      "Cure 24 h and remove the screw.",
      "<b>Pick the thread for your tripod:</b> most photo tripods have a 1/4-20 screw — run the reducer bushing into the nut with a flat screwdriver, slot downward. Video heads and heavier tripods with a 3/8-16 screw go straight into the nut; unscrew the bushing for those.",
    ],
    warn: "This one nut carries the whole head: the camera, the enclosure, the drum and the battery. The tripod screw pulls it down onto the drum floor, so the floor takes the load; the epoxy keeps it in the plate when the tripod is unscrewed. Do not use hot glue.",
    scene: { show: ["bank_plate"], add: [["insert", 0, 0, 60]], view: "iso-high", focus: "all", render: "tripod-insert",
             marks: [[0, 0, LY.nut_seat, "3/8-16 nut (1/4-20 via bushing)", 45, -45, 45]] },
  },
  {
    id: "power", phase: 1, title: "Power parts into the drum, drum under the enclosure", time: "75 min",
    parts: ["Power drum", "Bank plate, its tripod nut cured in", "USB-C PD trigger board (12 V)", "Rocker switch", "Power latch, built on a 3 × 7 cm perfboard (IRF4905, 2 × 2N3904, 8 resistors), on 4 × M3 standoffs", "12 V → 5 V 8 A buck on its standoffs, and the Schottky diode that came with it", `M3 × ${LY.mounts.buck.l} countersunk through the pocket walls: 4 for the buck, 4 for the latch`, `2 × M3 × ${LY.mounts.pd_trigger.l} countersunk up through the drum floor for the PD trigger, 2 × M3 × 8 for the plate`, "M3 × 6 screws for the top of the latch's 4 standoffs and the trigger's 2", "2 × M3 standoffs for the PD trigger", "Right-angle USB-C to USB-C cable, 30 cm", "18 AWG silicone wire, 470 µF", `${LY.drum.screws.length} × M3 × ${LY.drum.screw_l} countersunk for the drum`],
    tools: ["Soldering iron", "Multimeter", "4 A dummy load", "Stubby Phillips screwdriver (≤ 70 mm long)"],
    steps: [
      "<b>Wiring:</b> connections P1–P5, S1–S2 and R1 in the <a href='../12-wiring.md' target='_blank'>wiring guide</a>, steps 1–3. Build the power latch on the 3 × 7 cm perfboard first, from the <a href='../12-wiring.md#power-latch' target='_blank'>latch circuit</a>, keeping parts and wires clear of its four corner holes.",
      "<b>Bench-set the buck to 5.1 V under a 4 A dummy load before it goes anywhere near the Pi.</b> Open-circuit voltage tells you nothing; a unit that reads 5.1 V unloaded and 4.8 V loaded will brown the Pi out under load.",
      "Set the PD trigger to <b>12 V</b> on a real bank: press its button until the 12 V LED lights (5 → 9 → 12 → 15 → 20 V, one step per press; it remembers the setting through power cycles and bank swaps), then short its <b>S1</b> key-lock pad with solder so a stray press can't take it to 15 or 20 V. Leave the F1/F2 pads open. Confirm 12 V with a meter at its screw terminal, unplug and replug the bank, and confirm it again, before wiring anything else.",
      "<b>The drum:</b> a round open-topped box the enclosure's diameter. A pocket for the bank runs across it, open at one side, and the power parts go round the pocket. Work with the bank plate out: the board screws go through the pocket's walls from inside, low down where the plate will lie.",
      `<b>Buck:</b> it stands <b>on its long edge</b> against the pocket's ${LY.drum.edge.buck.wall === "back" ? "closed end" : "side wall"}, components facing out, on its four brass standoffs. Take the screws out of the standoffs' bottom ends, hold it against the wall over the four countersunk holes, and drive 4 × M3 × ${LY.mounts.buck.l} through the wall from inside the pocket into the standoffs, ${LY.drum.edge.buck.wall === "back" ? "reaching in through the pocket's open end" : "with a stubby screwdriver across the pocket"}. The heads sit flush, so the bank slides past them.`,
      `<b>Latch:</b> build and bench-test it first with the <a href='../../../setup/12a-power-latch.md' target='_blank'>power latch guide</a>. Screw four M3 × ${LY.parts.latch.standoff_h} mm standoffs to its corner holes from the top with short M3 screws (drill the holes to 3.2 mm if a screw won't pass), stand it on edge against the pocket's ${LY.drum.edge.latch.wall === "back" ? "closed end" : "other side wall"}, components out, and drive 4 × M3 × ${LY.mounts.latch.l} through the wall from inside the pocket into the standoffs, ${LY.drum.edge.latch.wall === "back" ? "reaching in through the open end" : "with the stubby screwdriver"}.`,
      `<b>PD trigger:</b> screw its two standoffs onto the holes at its socket end from the top (M3 × 6). Stand it on the drum floor where the model shows, beside the ${where(LY.drum.ang)} opening, on its standoffs and the small printed rest under its terminal end, and drive 2 × M3 × ${LY.mounts.pd_trigger.l} countersunk screws up from underneath into the standoffs (<a href='../../../setup/12c-power-boards.md' target='_blank'>preparing the trigger and buck</a>).`,
      "<b>Switch:</b> the round rocker goes through its hole in the drum wall from outside, the key flat on its thread lined up with the flat in the hole (that keeps ON at the top and stops it turning), its bezel flat on the flat spot cut into the wall; from inside, screw its ring up the thread against the flat boss, hand-tight plus a quarter turn.",
      "Wire the chain: trigger 12 V out → latch <b>IN</b>, latch <b>OUT</b> → the buck's Schottky diode, band toward the buck → buck 12 V in (<a href='../12-wiring.md#input-diode' target='_blank'>input diode</a>). Grounds common. The rocker only signals the latch (S1, S2): it carries under 1 mA, and the latch keeps the power on after you switch off until the Pi has saved the clip and shut down.",
      "Put the 470 µF across the buck output. Leave the buck's 5 V out on 18 AWG and the latch's HOLD and SENSE leads long enough (≈ 20 cm) to reach up through the enclosure floor and past the shelf to the Pi, the LED ring and the lid.",
      "<b>Bank cable:</b> plug the straight end of the right-angle USB-C cable into the trigger and lead it out through the nearer finger window beside the pocket's opening. Its right-angle end plugs into the bank later.",
      "<b>Bank plate:</b> drop it into the pocket, catch at the open end, nut down over the hole in the floor, and drive 2 × M3 × 8 countersunk up from underneath the drum into its inserts.",
      `<b>Drum under the enclosure:</b> feed the 5 V, HOLD and SENSE leads up through the round hole in the enclosure floor, set the enclosure on the drum with the outlines matching, and drive ${LY.drum.screws.length} × M3 × ${LY.drum.screw_l} countersunk screws <b>down from inside</b> the enclosure through its floor into the inserts in the drum's posts. The layout keeps a screwdriver's way clear above each one; the shelf isn't in yet. To get at a board later, take the shelf out and these screws, and lift the enclosure off.`,
    ],
    warn: "Use a right-angle USB-C cable: the bank's front face sits a little inside the drum's outline, and a straight plug would stick out and get knocked. Before closing up, check the trigger really negotiates 12 V from your bank through it.",
    scene: { show: [], add: [["power_drum", 0, 0, 0], ["bank_plate", 0, 0, 40], ["insert", 0, 0, 40], ["trigger", 0, 0, 30], ["switch", 0, 0, 30], ["latch", 0, 0, 50], ["buck", 0, 0, 50]],
             view: "iso-high", focus: "all", render: "power",
             marks: [[bx("trigger").cx, bx("trigger").cy, bx("trigger").z1, "PD trigger → 12 V", 30, 30, 45],
                     [bx("buck").cx, bx("buck").cy, bx("buck").z1, "buck on edge → 5.1 V @ 8 A", 40, -30, 40],
                     [bx("latch").cx, bx("latch").cy, bx("latch").z1, "power latch on edge", -40, 30, 40],
                     [bx("switch").cx, bx("switch").cy, bx("switch").z1, "rocker switch", -30, -30, 35],
                     [...polarXY(LY.base_d / 2, LY.drum.ang), LY.drum_z + 20, "bank pocket, open this side", 50, -50, 20]] },
  },
  {
    id: "led", phase: 1, title: "LED ring under the shelf, diffuser band", time: "30 min",
    parts: ["Shelf", "WS2812B 16-LED ring", "74AHCT125 level shifter, built on a 2 × 8 cm perfboard (12b), on 4 × M3 standoffs", "4 × M3 countersunk screws for the shifter (length in cad/FIT_REPORT.md)", "LED diffuser ring (white PETG)", "Double-sided foam tape", "CA or hot glue"],
    tools: ["Soldering iron"],
    steps: [
      "<b>Wiring:</b> connections R4, R5 and L1–L4 in the <a href='../12-wiring.md' target='_blank'>wiring guide</a>, with the 74AHCT125 pin numbers.",
      "Data comes out of <b>SPI0 MOSI, GPIO10</b>, not the classic <code>rpi_ws281x</code> PWM/DMA pin. A Pi 4 can do it either way, but the PWM driver needs the whole camera service to run as root and SPI does not.",
      "<b>Ring:</b> foam-tape it to the <b>underside</b> of the shelf, <b>LEDs facing down</b>, centred on the shelf's small centre hole. It then sits in the band of the LED window, just above the floor, and lights the window all the way round. Take its leads round the edge of the shelf through the cut-away side.",
      LY.shifter_on === "shelf"
        ? `<b>Shifter:</b> build it first, on the 2 × 8 cm perfboard (<a href='../../../setup/12b-level-shifter.md' target='_blank'>building the level shifter</a>). Screw its four standoffs on from the top (M3 × 6), stand it on the shelf over the four countersunk holes beside the Pi's place, and drive ${LY.mounts ? '4 × M3 × ' + LY.mounts.shifter.l : '4 × M3'} countersunk screws up from underneath the shelf into them, before the ring goes on. Ring 5 V and ground come from the buck, not the Pi.`
        : `<b>Shifter:</b> build it first, on the 2 × 8 cm perfboard (<a href='../../../setup/12b-level-shifter.md' target='_blank'>building the level shifter</a>). Screw its four standoffs on from the top (M3 × 6), stand it over its four countersunk holes in the floor where the model shows, and drive ${LY.mounts ? '4 × M3 × ' + LY.mounts.shifter.l : '4 × M3'} countersunk screws up from underneath into them. Ring 5 V and ground come from the buck, not the Pi.`,
      "<b>Diffuser band:</b> slide it down over the outside of the enclosure until it rests on the small ledge below the window, then fix it with four dabs of glue.",
      "Power up and run the three state colours with the shelf held in place. The band should glow evenly all the way round; the three posts behind the window cast faint shadows.",
    ],
    note: "Two walls and 0 % infill are what make the band glow instead of showing 16 hot spots. A white or natural shelf helps too: the ring lights its underside and that bounces out through the window.",
    scene: { show: [...SHELL, ...POWER], add: [...lift(SHELF, 60), ["led_diffuser_ring", 0, 0, 90]],
             view: "iso", focus: "all", render: "led",
             marks: [[0, 0, LY.ring_z0, "ring under the shelf, LEDs down", 75, 35, 40], [0, -LY.base_d / 2 - 2, BAND_Z + 8, "band over the window", 20, -60, 20]] },
  },
  {
    id: "pi", phase: 1, title: "Raspberry Pi 4 onto the shelf, shelf into the enclosure", time: "30 min",
    parts: ["Raspberry Pi 4 Model B 4 GB + heatsink/fan + 64 GB microSD", "4 × M2.5 × 6", "4 × M2.5 nylon standoffs, 6 mm", "3 × M3 × 8", "USB-C pigtail"],
    tools: ["2 mm driver", "2.5 mm hex key"],
    steps: [
      "<b>Wiring:</b> connection R2 in the <a href='../12-wiring.md' target='_blank'>wiring guide</a>, step 4; the latch's HOLD and SENSE leads (S3, S4) are step 5. Do the Pi setup for the latch (<a href='../14-software-setup.md#power-switch' target='_blank'>software setup</a>) before you rely on the switch to turn it off.",
      "Fit the heatsinks to the Pi <b>before</b> mounting it. It sits in a closed enclosure and you won't reach the chips afterwards. A fan case is taller: put its height in <code>ordered_parts.toml</code> and re-run <code>fit.py</code> first.",
      "Flash the card and enable I2C and SPI in <code>raspi-config</code>. If the camera is not detected on first boot, add <code>dtoverlay=imx477</code> to <code>/boot/firmware/config.txt</code>. The <code>usb_max_current_enable</code> flag is a Pi 5 thing and is not needed here.",
      "Screw the four 6 mm nylon standoffs into the shelf's Pi holes from underneath and mount the Pi on them with M2.5 × 6 — USB-C socket towards the shelf's cut-away side — and its USB ports towards the cable slot high in the wall, where the anchor leads come in.",

      "Plug the pigtail into the Pi's USB-C. Keep the 5 V run short and on 18 AWG; it carries 4 A.",

    scene: { show: [...SHELL, ...POWER, ...LED], add: lift([...SHELF, ...PI], 70),

             marks: [[LY.pi.x, LY.pi.y, LY.pi.z + 12, "Pi 4 on the shelf", -70, 25, 45],
                     [LY.post_r * Math.cos(LY.post_angs[0] * Math.PI / 180), LY.post_r * Math.sin(LY.post_angs[0] * Math.PI / 180), SHELF_Z, "shelf post", 30, 30, 30]] },
  },
  {
    id: "lid-ptz", phase: 2, title: "Arducam base onto the lid", time: "25 min",
    parts: ["Lid", "Arducam IMX477 PTZ camera with metal pan-tilt base", `4 × M3 × ${PTZ.bolt_l}`,
            ...(LY.ptz_washers ? [`${4 * LY.ptz_washers} × M3 washer`] : [])],
    tools: ["Calipers", "2.5 mm hex key"],

/* =====================================================================
   UI (framework-free). Works before/without the 3D viewer; the viewer
   registers itself via the 'viewer-ready' event.
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const STORE_KEY = "sportcam-assembly-done";
let current = 0;
let done = new Set();
let viewer = null;          // { showStep(step), replay(), setExplode(t), setView(name), setXray(b), setLabels(b), setDemo(b) }

try { done = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (e) { /* storage unavailable */ }
function saveDone() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ } }

function buildNav() {
  const nav = $("stepNav");
  const sel = $("stepSelect");
  let html = "";
  let selHtml = "";
  PHASES.forEach((ph, pi) => {
    html += `<div class="phase">${pi + 1}. ${ph}</div><ol>`;
    STEPS.forEach((s, i) => {
      if (s.phase !== pi) return;
      html += `<li><button data-i="${i}" id="nav-${s.id}"><span class="n">${i + 1}</span><span><span class="t">${s.title}</span><span class="meta">${s.time}</span></span></button></li>`;
      selHtml += `<option value="${i}">${i + 1}. ${s.title}</option>`;
    });
    html += "</ol>";
  });
  nav.innerHTML = html;
  sel.innerHTML = selHtml;
  nav.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => go(+b.dataset.i)));
  sel.addEventListener("change", () => go(+sel.value));
}

// Names of parts and tools become buttons that open a picture and a
// description (docs/setup/assembly/catalog.js, shared by both builds).
const linkify = (x) => (window.SportcamCatalog ? SportcamCatalog.linkify(x) : x);
function list(items) { return items.length ? "<ul>" + items.map((x) => `<li>${linkify(x)}</li>`).join("") + "</ul>" : "<p class='muted'>none</p>"; }

function renderDetail(s) {
  let h = "";
  if (s.warn) h += `<div class="warn"><strong>Check:</strong> ${s.warn}</div>`;
  h += `<div class="panel"><h3>Do this</h3><ol>${s.steps.map((x) => `<li>${x}</li>`).join("")}</ol></div>`;
  if (s.note) h += `<div class="note"><strong>Tip:</strong> ${s.note}</div>`;
  const hint = window.SportcamCatalog ? `<span class="cat-hint">tap a name for a picture</span>` : "";
  h += `<div class="panel two"><div><h3>Parts${hint}</h3>${list(s.parts)}</div><div><h3>Tools</h3>${list(s.tools)}</div></div>`;
  $("detail").innerHTML = h;
}

function updateProgress() {
  $("progressLabel").textContent = `${done.size} / ${STEPS.length} done`;
  $("progressBar").style.width = (100 * done.size / STEPS.length) + "%";
  STEPS.forEach((s, i) => {
    const b = $("nav-" + s.id);
    b.classList.toggle("done", done.has(s.id));
    b.classList.toggle("active", i === current);
  });
  const isDone = done.has(STEPS[current].id);
  $("btnDone").textContent = isDone ? "✓ Done" : "✓ Mark done";
  $("btnDone").classList.toggle("done", isDone);
}

function go(i, replaceHash) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[current];
  $("stepTitle").textContent = `${current + 1}. ${s.title}`;
  $("stepPhase").textContent = PHASES[s.phase];
  $("stepTime").textContent = s.time;
  $("stepSelect").value = current;
  renderDetail(s);
  $("btnPrev").disabled = current === 0;
  $("btnNext").textContent = current === STEPS.length - 1 ? "Finish" : "Next →";
  $("btnDemo").hidden = !s.scene.demo;
  $("btnXray").classList.toggle("on", !!s.scene.xray);
  syncXrayLevel();
  $("explode").value = 1000;
  updateProgress();
  if (viewer) viewer.showStep(s);
  const h = "#" + s.id;
  if (location.hash !== h) { if (replaceHash) history.replaceState(null, "", h); else location.hash = h; }
  const nb = $("nav-" + s.id); if (nb) nb.scrollIntoView({ block: "nearest" });
  $("main").scrollTo({ top: 0, behavior: "smooth" });
}

function stepFromHash() {
  const id = location.hash.slice(1);
  const i = STEPS.findIndex((s) => s.id === id);
  return i < 0 ? 0 : i;
}

$("btnPrev").addEventListener("click", () => go(current - 1));
$("btnNext").addEventListener("click", () => {
  if (current === STEPS.length - 1) { done.add(STEPS[current].id); saveDone(); updateProgress(); return; }
  go(current + 1);
});
$("btnDone").addEventListener("click", () => {
  const id = STEPS[current].id;
  if (done.has(id)) done.delete(id); else done.add(id);
  saveDone(); updateProgress();
});
$("btnReplay").addEventListener("click", () => viewer && viewer.replay());
$("explode").addEventListener("input", (e) => viewer && viewer.setExplode(e.target.value / 1000));
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => viewer && viewer.setView(b.dataset.view)));
$("btnXray").addEventListener("click", () => { const b = $("btnXray"); b.classList.toggle("on"); syncXrayLevel(); viewer && viewer.setXray(b.classList.contains("on")); });
// the x-ray transparency slider: shown while x-ray is on, remembered in this browser
function syncXrayLevel() { $("xrayLevel").hidden = !$("btnXray").classList.contains("on"); }
function setXrayPct(v, save) {
  $("xrayPct").value = v; $("xrayPctOut").textContent = v + "%";
  if (viewer && viewer.setXrayLevel) viewer.setXrayLevel(+v);
  if (save) try { localStorage.setItem("sportcam-xray-pct", v); } catch (e) {}
}
$("xrayPct").addEventListener("input", (e) => setXrayPct(e.target.value, true));
try { const v = localStorage.getItem("sportcam-xray-pct"); if (v != null && v !== "" && isFinite(v)) setXrayPct(Math.max(0, Math.min(100, +v)), false); } catch (e) {}
$("btnLabels").addEventListener("click", () => { const b = $("btnLabels"); b.classList.toggle("on"); viewer && viewer.setLabels(b.classList.contains("on")); });
$("btnDemo").addEventListener("click", () => { const b = $("btnDemo"); b.classList.toggle("on"); b.textContent = b.classList.contains("on") ? "■ Stop demo" : "▶ Motion demo"; viewer && viewer.setDemo(b.classList.contains("on")); });

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (document.querySelector("dialog[open]")) return;   // a part's picture is open
  if (e.key === "ArrowRight") go(current + 1);
  else if (e.key === "ArrowLeft") go(current - 1);
  else if (e.key.toLowerCase() === "d") $("btnDone").click();
  else if (e.key.toLowerCase() === "r") $("btnReplay").click();
  else if (e.key.toLowerCase() === "x") $("btnXray").click();
  else if (e.key.toLowerCase() === "l") $("btnLabels").click();
});
window.addEventListener("hashchange", () => { const i = stepFromHash(); if (i !== current) go(i, true); });

window.addEventListener("viewer-ready", (e) => {
  viewer = e.detail;
  if (window.SportcamCatalog) SportcamCatalog.snapshot = viewer.snapshot;
  $("stageMsg").remove();
  if (viewer.setXrayLevel) viewer.setXrayLevel(+$("xrayPct").value);
  viewer.setXray($("btnXray").classList.contains("on"));
  viewer.showStep(STEPS[current]);
});
window.addEventListener("viewer-failed", (e) => {
  // No WebGL or no internet for three.js: fall back to the pre-rendered
  // turntables in renders/ (python3 docs/setup/assembly/render_steps.py).
  $("stageMsg").remove();
  $("stageHint").textContent = "offline mode · drag to spin between pre-rendered views";
  document.querySelectorAll(".viewer-bar").forEach((el) => el.hidden = true);
  viewer = makeTurntable($("stage"));
  viewer.showStep(STEPS[current]);
  console.warn("3D viewer unavailable, using pre-rendered turntable:", e.detail);
});

function makeTurntable(stage) {
  const N = 8;
  const img = document.createElement("img");
  img.alt = "assembly step rendering";
  stage.prepend(img);
  let frame = 5, base = "";
  const set = (f) => { frame = ((f % N) + N) % N; img.src = `renders/${base}_${frame}.png`; };
  img.onerror = () => { img.alt = "No pre-rendered view for this step. Run: python3 docs/setup/assembly/render_steps.py"; };
  let drag = null;
  stage.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, f: frame }; stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", (e) => { if (drag) set(drag.f + Math.round((e.clientX - drag.x) / 40)); });
  stage.addEventListener("pointerup", () => { drag = null; stage.classList.remove("dragging"); });
  return {
    showStep(s) { base = s.scene.render || s.id; set(5); },
    replay() {}, setExplode() {}, setView() {}, setXray() {}, setXrayLevel() {}, setLabels() {}, setDemo() {},
  };
}

buildNav();
go(stepFromHash(), true);
</script>

<script type="module">
/* =====================================================================
   Live 3D viewer: real STL geometry (models.js) + simple hardware models,
   animated insertion per step, orbit controls, callouts, x-ray, demo.
   ===================================================================== */
let THREE, OrbitControls, CSS2DRenderer, CSS2DObject;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  ({ CSS2DRenderer, CSS2DObject } = await import("three/addons/renderers/CSS2DRenderer.js"));
  if (!window.SPORTCAM_MODELS) throw new Error("models.js missing — run python3 docs/setup/assembly/build_models.py");
  const c = document.createElement("canvas");
  if (!(c.getContext("webgl2") || c.getContext("webgl"))) throw new Error("WebGL unavailable");
} catch (err) {
  window.dispatchEvent(new CustomEvent("viewer-failed", { detail: String(err) }));
  throw err;
}

const COL = {
  print: 0xc3ccdb, printAlt: 0xb3bdd0, white: 0xf3f3ee, black: 0x2a2e35, pcb: 0x2f7a4c, steel: 0xb3b7bd,
  dark: 0x4a4f57, brass: 0xc9a24a, blue: 0x1e4f8f, purple: 0x5b3d8a, rubber: 0x1c1c1c, wire: 0x8e2b2b,
  ffc: 0xe9e3cf, lensGlass: 0x1b3550, cream: 0xf0e4a0, tripod: 0x50555d, sig: 0xe2b33a, servo: 0xd9772b,
};
const ACCENT = new THREE.Color(0x2f6fed);
const GREEN = 0x1f9d55;

function mat(color, opts = {}) {
  const m = new THREE.MeshStandardMaterial({ color, flatShading: true, metalness: opts.metal ?? 0.08, roughness: opts.rough ?? 0.72,
    transparent: opts.opacity != null, opacity: opts.opacity ?? 1, side: opts.double ? THREE.DoubleSide : THREE.FrontSide });
  if (opts.elec) m.userData.elec = true;     // an electrical part inside a mechanical model (a servo): solid in x-ray
  return m;
}

/* ---- geometry helpers (OpenSCAD axes) -------------------------------- */
const box = (w, l, h) => new THREE.BoxGeometry(w, l, h);
function cyl(r, h, axis = "z", rTop) {
  const g = new THREE.CylinderGeometry(rTop ?? r, r, h, 32);
  if (axis === "z") g.rotateX(Math.PI / 2); else if (axis === "x") g.rotateZ(Math.PI / 2);
  return g;
}
function tube(ro, ri, h, axis = "z") {
  const s = new THREE.Shape(); s.absarc(0, 0, ro, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 0, ri, 0, Math.PI * 2, true); s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 40 });
  g.translate(0, 0, -h / 2);
  if (axis === "y") g.rotateX(Math.PI / 2); else if (axis === "x") g.rotateY(Math.PI / 2);
  return g;
}
function beltGeo(R, r, d, thick, width) {
  const path = (R1, r1) => {
    const a = Math.acos((R1 - r1) / d);
    const s = new THREE.Shape();
    s.moveTo(R1 * Math.cos(a), R1 * Math.sin(a));
    s.absarc(0, 0, R1, a, Math.PI * 2 - a, false);
    s.lineTo(d + r1 * Math.cos(-a), r1 * Math.sin(-a));
    s.absarc(d, 0, r1, -a, a, false);
    s.closePath();
    return s;
  };
  const outer = path(R + thick, r + thick);
  const inner = path(R, r);
  outer.holes.push(inner);
  return new THREE.ExtrudeGeometry(outer, { depth: width, bevelEnabled: false, curveSegments: 64 });
}
function cable(points, r, color) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, r, 10, false), mat(color, { rough: 0.9 }));
  m.material.flatShading = false;
  return m;
}
function mesh(g, color, opts) { return new THREE.Mesh(g, mat(color, opts)); }
function at(m, x, y, z, rx = 0, ry = 0, rz = 0) { m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return m; }
function group(...children) { const g = new THREE.Group(); children.forEach((c) => g.add(c)); return g; }

function stlGeometry(name) {
  const d = window.SPORTCAM_MODELS[name];
  if (!d) throw new Error("model missing: " + name);
  const vb = Uint8Array.from(atob(d.v), (ch) => ch.charCodeAt(0));
  const ib = Uint8Array.from(atob(d.i), (ch) => ch.charCodeAt(0));
  const q = new Uint16Array(vb.buffer, vb.byteOffset, d.nv * 3);
  const idx = d.i32 ? new Uint32Array(ib.buffer, ib.byteOffset, d.nt * 3) : new Uint16Array(ib.buffer, ib.byteOffset, d.nt * 3);
  const pos = new Float32Array(d.nv * 3);
  for (let i = 0; i < d.nv; i++) for (let k = 0; k < 3; k++)
    pos[i * 3 + k] = d.min[k] + (q[i * 3 + k] / 65535) * (d.max[k] - d.min[k]);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  return g;
}

/* ---- parts placed by cad/fit.py ----------------------------------------
   placed(key, fn): a board from LY.boxes, drawn in its own frame (centre
   origin, z = 0 on the floor tape, +x along its length) and moved to where
   the solver put it. `mid` centres it vertically (the switch). */
function placed(key, fn, mid) {
  const b = LY.boxes[key];
  if (b.edge) {
    // standing on edge against a pocket wall: drawn flat in its own frame (z up from the standoffs'
    // ends), then stood up so the standoffs meet the wall and the components face away from it
    const flat = { ...b, w: b.z1 - b.z0, z0: 0, z1: b.w };
    const inner = group(...fn(flat));
    inner.rotation.x = b.edge > 0 ? -Math.PI / 2 : Math.PI / 2;
    inner.position.set(0, -b.edge * b.w / 2, (b.z0 + b.z1) / 2);
    const g = new THREE.Group(); g.add(inner);
    g.position.set(b.cx, b.cy, 0);
    g.rotation.z = THREE.MathUtils.degToRad(b.ang);
    return g;
  }
  const g = group(...fn(b));
  g.position.set(b.cx, b.cy, mid ? (b.z0 + b.z1) / 2 : b.z0);
  g.rotation.z = THREE.MathUtils.degToRad(b.ang);
  return g;
}
function piPlaced(fn) {   // the Pi's frame: centre origin, z = 0 under the board, +x to the USB end, −y the power edge
  const p = LY.parts.pi, g = group(...fn(p, p.l / 2, p.w / 2));
  g.position.set(LY.pi.x, LY.pi.y, LY.pi.z);
  g.rotation.z = THREE.MathUtils.degToRad(LY.pi.ang);
  return g;
}
function piPoint(x, y, z) {    // Pi-frame point → world (OpenSCAD) coordinates
  const a = LY.pi.ang * Math.PI / 180;
  return [LY.pi.x + x * Math.cos(a) - y * Math.sin(a), LY.pi.y + x * Math.sin(a) + y * Math.cos(a), LY.pi.z + z];

/* ---- the parts catalogue ---------------------------------------------

    for (const a of [90, 210, 330]) {

    const g = group(at(mesh(box(k.l, k.w, k.h), COL.dark, { rough: 0.5 }), 0, 0, 0),

      // signals

function uwbBoard(cx, cy, z, radialSign) {   // a ULA1: plug at local −x, antenna at +x

function usbLead(from, mast) {   // anchor plug → round to the wall slot → the Pi's USB ports
  const e = LY.usb_entry, a = e.ang * Math.PI / 180, R = LY.base_d / 2;
  const out = [(R + 6) * Math.cos(a), (R + 6) * Math.sin(a), e.z], inn = [(R - 8) * Math.cos(a), (R - 8) * Math.sin(a), e.z];
  const p = LY.parts.pi, port = piPoint(p.l / 2 + p.port_overhang + 10, -p.w / 2 + 14, 9);
  const pts = mast ? [from, [from[0] - 6, 0, A3_Z - 40], [from[0] - 6, 0, e.z + 20], out, inn, port]
                   : [from, [from[0] - 10, from[1] * 0.85, BOARD_Z + 4], [out[0] * 1.4, out[1] * 1.4, e.z - 10], out, inn, port];
  return cable(pts, 1.5, COL.black);

/* ---- the wiring: where each lead in the wiring guide starts, runs and ends ----
   Drum leads are worked out in the bank pocket's frame (bank along +x, open end at +x, the tripod
   axis at the origin) and turned by LY.drum.ang. They run round the pocket's closed end, clear of the
   posts, to the boards' terminals, and up through the floor hole above the buck. Above the floor, the
   leads run under the shelf to its cut-away side, up through it, round the Pi's SD-card end to the
   header and the shifter, and up through the lid's cable slot to the camera head. Called by the
   wiring parts and by the cabling step's callouts, so it uses no colours (COL comes later). */
function wirePts() {
  if (wirePts.memo) return wirePts.memo;
  const D = LY.drum, rad = Math.PI / 180, dir = (deg) => [Math.cos(deg * rad), Math.sin(deg * rad)];
  const ca = Math.cos(D.ang * rad), sa = Math.sin(D.ang * rad);
  const W = (p) => [p[0] * ca - p[1] * sa, p[0] * sa + p[1] * ca, p[2]];                    // pocket frame → world
  const toP = (x, y) => [x * ca + y * sa, -x * sa + y * ca];                                 // world → pocket frame
  const d2 = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]);
  // a board in the pocket frame: s along it, t out from its centre towards its components, at height z
  const on = (k, s, t, z) => { const b = bx(k), c = toP(b.cx, b.cy), u = dir(b.ang - D.ang), e = b.edge || 0;
    return [c[0] + u[0] * s - u[1] * e * t, c[1] + u[1] * s + u[0] * e * t, z]; };
  const centre = (k) => toP(bx(k).cx, bx(k).cy);
  const T = bx("trigger"), tp = LY.parts.pd_trigger, B = bx("buck"), L = bx("latch");
  const tz = T.z0 + tp.standoff_h + (tp.pcb_t || 1.6);
  const trigTerm = on("trigger", -(T.l / 2 - 3), 0, tz + 5);                 // its screw terminal: 12 V and GND
  const trigSock = on("trigger", T.l / 2 - 2, 0, tz + tp.port_h / 2);        // its USB-C socket
  // the edge boards' terminals: on their components' side, near the top edge, in from an end
  const term = (k, s) => on(k, s, bx(k).w / 2 - 5, bx(k).z1 - 6);
  const lEnd = [1, -1].sort((a, b) => d2(term("latch", a * 29), centre("trigger")) - d2(term("latch", b * 29), centre("trigger")))[0];
  const bEnd = [1, -1].sort((a, b) => d2(term("buck", a * 34), centre("latch")) - d2(term("buck", b * 34), centre("latch")))[0];
  const ls = (L.l / 2 - 6) * lEnd, bs = (B.l / 2 - 6) * bEnd;
  const latchIn = term("latch", ls), latchSw = term("latch", ls - 10 * lEnd);          // the end nearer the trigger
  const latchOut = term("latch", -ls), latchSig = term("latch", -ls + 10 * lEnd);      // the end nearer the buck
  const buckIn = term("buck", bs), buckOut = term("buck", -bs);
  // the rocker's terminals: the inner end of its body
  const SB = bx("switch_body"), swEnds = [1, -1].map((s) => on("switch_body", s * (SB.l / 2 + 2), 0, (SB.z0 + SB.z1) / 2));
  const swTerm = swEnds.reduce((a, b) => Math.hypot(a[0], a[1]) < Math.hypot(b[0], b[1]) ? a : b);
  // round each back corner of the pocket: the point off it clearest of the drum's posts and wall
  const posts = D.post_angs.map((a) => { const r = D.R_in - D.post_d / 2 + 1; return [r * Math.cos((a - D.ang) * rad), r * Math.sin((a - D.ang) * rad)]; });
  const corner = (side, z) => { const c = [D.x0 - D.pw, side > 0 ? D.y1 + D.pw : D.y0 - D.pw]; let best = c, bc = -1e9;
    for (let a = 0; a <= 90; a += 10) for (const r of [4, 6, 8]) {
      const v = dir((side > 0 ? 90 : 180) + a), q = [c[0] + v[0] * r, c[1] + v[1] * r];
      const cl = Math.min(...posts.map((o) => d2(q, o) - D.post_d / 2), D.R_in - Math.hypot(...q));
      if (cl > bc) { bc = cl; best = q; } }
    return [...best, z]; };
  const sideOf = (p) => (p[1] > (D.y0 + D.y1) / 2 ? 1 : -1);
  const hole = toP(D.wire_hole[0], D.wire_hole[1]);
  const up = (z) => [hole[0], hole[1], z];
  const along = (p, q, f, z) => [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, z];
  const outside = (s, z) => on("buck", s, B.w / 2 + 3, z);                  // just past the buck's components
  const drum = {
    p12: [trigTerm, [trigTerm[0] - 14, trigTerm[1] - 3, trigTerm[2] + 2], corner(sideOf(latchIn), latchIn[2]), latchIn],
    s12: [swTerm, along(swTerm, corner(sideOf(latchSw), 0), 0.5, swTerm[2] - 2), corner(sideOf(latchSw), latchSw[2] + 2), latchSw],
    p34: [latchOut, corner(sideOf(latchOut), latchOut[2] + 6), along(corner(sideOf(latchOut), 0), buckIn, 0.5, buckIn[2] - 2), buckIn],
    out: [buckOut, along(buckOut, hole, 0.5, -3), up(-1.5), up(LY.floor_z + 4)],
    s34: [latchSig, corner(sideOf(latchSig), latchSig[2] + 8), outside(-bs * 0.6, -5), outside(0, -2), up(-1), up(LY.floor_z + 4)],
  };
  // P1: the right-angle plug in the bank's face, the cable hugging the face to the finger window on the
  // trigger's side (a notch through the pocket wall and the drum wall), in through it and down to the
  // trigger's socket
  const k = LY.parts.power_bank, yc = (D.y0 + D.y1) / 2, face = (D.x0 + D.x1) / 2 + k.l / 2 + 0.3;
  const zb = LY.drum_z + D.bank_z + k.h / 2, sw = sideOf([0, centre("trigger")[1]]);
  const wy = sw > 0 ? D.y1 + D.pw / 2 : D.y0 - D.pw / 2;
  const wz = LY.drum_z + D.floor + D.plate_t + LY.design.finger_z;           // the window's bottom
  const p1 = [[face + 3, yc + sw * 5, zb], [face + 2.5, yc + sw * (D.iw / 2 - 8), zb], [D.x1 - 2, wy + sw * 1.5, zb],
              [D.x1 - 10, wy + sw * 7, Math.max(zb - 2, wz + 3)], [trigSock[0] + 10, trigSock[1], trigSock[2] + 3], trigSock];
  const Wl = (pts) => pts.map(W);

  // ---- above the floor ----
  const p = LY.parts.pi, hl = p.l / 2, hw = p.w / 2;
  const Pp = (x, y, z) => { const q = piPoint(x, y, 0); return [q[0], q[1], z]; };                 // Pi frame
  const S = bx("shifter"), sh = LY.parts.shifter, sr = S.ang * rad;
  const Sp = (x, y, z) => [S.cx + x * Math.cos(sr) - y * Math.sin(sr), S.cy + x * Math.sin(sr) + y * Math.cos(sr), z];
  const fy = (() => { const dx = LY.pi.x - S.cx, dy = LY.pi.y - S.cy; return -dx * Math.sin(sr) + dy * Math.cos(sr) > 0 ? 1 : -1; })();
  const sTop = S.z0 + sh.standoff_h + 1.6;                    // the shifter's board, top face
  const zU = LY.floor_z + 6, zA = LY.shelf_top + 8, zT = LY.lid_z - 4;   // under the shelf, over it, under the lid
  const pinXY = (n) => [p.gpio_x0 - hl + 1.27 + 2.54 * Math.floor((n - 1) / 2), hw - 3.5 + (n % 2 ? -1.27 : 1.27)];
  const pin = (a, b, z = LY.pi.z + p.pcb_t + p.gpio_lead_h) => { const A = pinXY(a), Bq = pinXY(b ?? a); return Pp((A[0] + Bq[0]) / 2, (A[1] + Bq[1]) / 2, z); };
  const overPin = (a, b) => pin(a, b, zT);
  // round the enclosure at radius r, z, from p's angle to q's: the short way, unless that's nearly a half
  // turn, then by the side `via` points to, so leads from the same place stay together
  const arc = (p0, q0, r, z, via) => { const a0 = Math.atan2(p0[1], p0[0]); let d = Math.atan2(q0[1], q0[0]) - a0;
    while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    if (via && Math.abs(d) > 2 * Math.PI / 3 && Math.cos(a0 + d / 2) * via[0] + Math.sin(a0 + d / 2) * via[1] < 0) d -= Math.sign(d) * 2 * Math.PI;
    const n = Math.max(1, Math.ceil(Math.abs(d) / (Math.PI / 6))), out = [];
    for (let i = 0; i <= n; i++) out.push([r * Math.cos(a0 + d * i / n), r * Math.sin(a0 + d * i / n), z]);
    return out; };
  const H = W(up(LY.floor_z + 4)), Rin = D.R_in;
  // the shelf's cut-away side: off = sideways, + towards the Pi's SD-card end
  const gu = dir(LY.gap_ang), gv0 = [-gu[1], gu[0]], sdEnd = dir(LY.pi.ang + 180);
  const gv = gv0[0] * sdEnd[0] + gv0[1] * sdEnd[1] > 0 ? gv0 : [-gv0[0], -gv0[1]], gr = (LY.gap_d + Rin) / 2;
  const G = (off, z) => [gu[0] * gr + gv[0] * off, gu[1] * gr + gv[1] * off, z];
  const under = (to, r = 60) => [H, ...arc(H, to, r, zU, dir(LY.pi.ang + 180))];        // hole → round under the shelf, by the SD-card end
  // round the Pi's SD-card end, up from the cut-away side to the header side
  const sdRun = (dx) => [Pp(-hl - dx, -hw + 2, zA), Pp(-hl - dx, hw - 1, zA + 4)];
  // the PTZ base's cable slot in the lid: the 16 mm ribbon flat across its middle, the other leads either
  // side of it, off sideways from its centre, straight through; and up from it, outside the base, to the head
  const cs = LY.cable_slot, sc = dir(cs.ang), tv = dir(cs.ang + 90), kOut = (LY.parts.ptz.base_d / 2 + 14) / cs.r;
  const slot = (off, z) => [sc[0] * cs.r + tv[0] * off, sc[1] * cs.r + tv[1] * off, z];
  const slotRun = (off) => [slot(off, LID_Z - 10), slot(off, LID_Z - 4), slot(off, LID_TOP + 4), slot(off, LID_TOP + 10)];
  const outBase = (off) => [[sc[0] * cs.r * kOut + tv[0] * off, sc[1] * cs.r * kOut + tv[1] * off, PTZ_Z + 4],
                            [sc[0] * cs.r * kOut + tv[0] * off, sc[1] * cs.r * kOut + tv[1] * off, TILT_Z - 10]];
  const C = PTZ_CTRL, sx = C.x + 3.3;                                             // the controller's socket, opening to +y
  const toHead = (off, z) => [...slotRun(off), ...outBase(off),                    // round the bracket's +y arm into it
                              [-40, 28, z - 2], [0, 31, z], [sx, 28, z], [sx, C.sockY + 0.5, z]];
  // the pigtail: its plug in the Pi's USB-C, out over the shelf's cut-away edge
  const ux = p.usbc_x - hl, plugZ = LY.pi.z + p.pcb_t + 1.6;
  const plugMid = Pp(ux, -hw - p.plug_l / 2 + 2, plugZ), plugBack = Pp(ux, -hw - p.plug_l + 2, plugZ);
  const drop = Pp(ux, -hw - p.plug_l - 8, zA);
  // the ring's pads: on its outer edge, on the cut-away side
  const ring = LY.parts.led_ring, rz = (LY.ring_z0 + LY.ring_z1) / 2;
  const pad = (da, r = ring.od / 2 + 1) => { const v = dir(LY.gap_ang + da); return [v[0] * r, v[1] * r, rz]; };
  const trunk = [...under(G(42, 0)), G(42, zA), ...sdRun(13)];              // R3, R5, R7, S3/S4 share this run
  const hdr = (y) => Sp(20, y, sTop + 8.5), chip = (x) => Sp(x, fy * 2, sTop + 3.5);
  const R = {
    r2: [...under([drop[0], drop[1]]), drop, [plugBack[0], plugBack[1], plugZ + 2], plugBack],
    r4: [...under(pad(6)), [pad(6, 34)[0], pad(6, 34)[1], rz], pad(6)],
    r5: [...trunk, Sp(-sh.l / 2 + 10, fy * (sh.w / 2 + 3), sTop + 4), Sp(-sh.l / 2 + 10, fy * (sh.w / 2 - 3), sTop + 0.5)],
    r7: [...trunk, Sp(-sh.l / 2 + 10, fy * (sh.w / 2 + 3), zT), Sp(14, fy * 5, zT), Sp(14, fy * 5, sTop + 0.5)],
    r3: [...trunk, ...toHead(-12, PTZ_CTRL.sockZ - 3)],
    s34: [...drum.s34.map(W), ...under(G(42, 0)).slice(1), G(42, zA), ...sdRun(13), overPin(11, 13), pin(11, 13)],
    l1: [pin(19), overPin(19), [chip(-16)[0], chip(-16)[1], zT], chip(-16)],
    l2: [chip(-12), [chip(-12)[0], chip(-12)[1], zT], Pp(-hl - 9, hw - 1, zT - 4), Pp(-hl - 9, -hw + 2, zA), G(36, zA), G(36, zU + 4),
         [pad(-6, 34)[0], pad(-6, 34)[1], rz], pad(-6)],
    m12: [pin(32, 33), overPin(32, 33), [chip(-8)[0], chip(-8)[1], zT], chip(-8)],
    i12: [pin(3, 5), overPin(3, 5), ...toHead(-9.6, PTZ_CTRL.sockZ + 3)],
    pan: [[-10, 0, PTZ_Z - 10], [-34, 0, PTZ_Z - 16], ...slotRun(9.4).reverse(), Sp(20, fy * 2.5, zT), hdr(fy * 2.5)],
    tilt: [[-30, -6, TILT_Z - 3], [-40, -9, TILT_Z - 6], ...outBase(12).reverse(), ...slotRun(12).reverse(), Sp(22, -fy * 2.5, zT), hdr(-fy * 2.5)],
  };
  wirePts.memo = { p12: Wl(drum.p12), s12: Wl(drum.s12), p34: Wl(drum.p34), out: Wl(drum.out),
                   p1: Wl(p1), p1plug: W([face + 3.5, yc, zb]), ...R, plugMid, H, slotTop: slot(0, LID_TOP), hdr: hdr(0), pin11: pin(11, 13) };
  return wirePts.memo;
}
window.wirePts = wirePts;   // for the cabling step's callouts, in the steps script
function pair(points, r, colA, colB) { return strands(points, r, [colA, colB]); }   // two leads side by side along one route
function strands(points, r, cols) {     // several leads side by side along one route, a flat bundle
  const off = (sgn) => points.map((q, i) => {
    const a = points[Math.max(0, i - 1)], b = points[Math.min(points.length - 1, i + 1)];
    const t = new THREE.Vector3(b[0] - a[0], b[1] - a[1], b[2] - a[2]).normalize();
    const n = new THREE.Vector3().crossVectors(t, new THREE.Vector3(0, 0, 1));
    if (n.length() < 0.3) n.crossVectors(t, new THREE.Vector3(1, 0, 0));
    n.normalize().multiplyScalar(sgn * r * 1.05);
    return [q[0] + n.x, q[1] + n.y, q[2] + n.z];
  });
  return group(...cols.map((c, i) => cable(off(2 * i - (cols.length - 1)), r, c)));
}

// the camera head, in front of the tilt axis: the U-bracket's face plate (ux), the PTZ controller (x) and the camera
// board (cam), and where the controller's two sockets are (the leads end on them)
const PTZ_CTRL = (() => { const ux = 16, x = 22, cam = 34.8;
  return { ux, x, cam, armY: 19.25, sockY: 19, sockZ: TILT_Z - 4, lensY: 8,
           lensLead: [[cam + 18, 8, TILT_Z + 17.5], [cam + 18, 8, TILT_Z + 23], [cam - 4, 8, TILT_Z + 25], [x + 3, 8, TILT_Z + 24],
                      [x + 3, 8, TILT_Z + 19]] }; })();
window.PTZ_CTRL = PTZ_CTRL;     // the step marks (in the classic script) point at its sockets

/* ---- scene ------------------------------------------------------------ */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xf3f5f9);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = "labels";
stage.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f5f9);
const camera = new THREE.PerspectiveCamera(38, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.1;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8e96a6, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(260, 420, 180);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 10, far: 1500 });
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5); fill.position.set(-300, 160, -220); scene.add(fill);

const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);   // OpenSCAD Z-up → three Y-up
const groups = { static: new THREE.Group(), pan: new THREE.Group(), tilt: new THREE.Group() };
root.add(groups.static); root.add(groups.pan);
const tiltPivot = new THREE.Group(); tiltPivot.position.set(0, 0, TILT_Z); groups.pan.add(tiltPivot);
groups.tilt.position.set(0, 0, -TILT_Z); tiltPivot.add(groups.tilt);
const overlay = new THREE.Group(); root.add(overlay);      // arrows, leader lines
const labelsGroup = new THREE.Group(); root.add(labelsGroup);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.ShadowMaterial({ opacity: 0.12 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(1200, 24, 0xd5dbe6, 0xe4e8f0); grid.position.y = -0.5; scene.add(grid);

const built = {};  // id -> { obj, seat: Vector3, mats: Material[], box: Box3 (local, at seat) }
function build(id) {
  if (built[id]) return built[id];
  const def = PARTS[id];
  let obj;
  if (def.stl) {
    obj = new THREE.Mesh(stlGeometry(def.stl), mat(def.color, { opacity: def.opacity, double: def.double }));
    if (def.pos) obj.position.set(...def.pos);
    if (def.rot) obj.rotation.set(...def.rot);
    // wrap so explode offsets apply in group space without disturbing the part's own transform
    const w = new THREE.Group(); w.add(obj); obj = w;
  } else {
    obj = def.build();
  }
  const mats = [];
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; mats.push(o.material); o.material.userData.base = { opacity: o.material.opacity, transparent: o.material.transparent, depthWrite: o.material.depthWrite }; } });
  groups[def.grp].add(obj);
  obj.updateWorldMatrix(true, true);
  let bb = new THREE.Box3().setFromObject(obj);  // world (three) coords at seat
  if (![bb.min.x, bb.min.y, bb.min.z, bb.max.x, bb.max.y, bb.max.z].every(Number.isFinite)) {
    // a model built from a missing layout value; leave it out of the framing so it can't blank every step
    console.error(`assembly viewer: part "${id}" has non-finite geometry; a layout value it uses is missing`);
    bb = new THREE.Box3();
  }
  const rec = { obj, seat: obj.position.clone(), mats, box: bb, def };
  built[id] = rec;
  obj.visible = false;
  return rec;
}

/* ---- step state -------------------------------------------------------- */
const VIEWS = {    // direction from target to camera, OpenSCAD coords (x, y, z-up)
  "iso": [1.25, -1.1, 0.85], "iso-high": [1.1, -1.0, 1.4], "iso-low": [1.25, -1.1, 0.45], "iso-back": [-1.2, -1.1, 0.9],
  "front": [1, 0.05, 0.3], "front-high": [1, -0.25, 0.7], "side": [0.05, -1, 0.3], "side-low": [0.3, -1, 0.12],
  "top": [0.15, -0.25, 1], "under": [0.9, -0.8, -0.9], "under-iso": [1.1, -1.0, -0.75],
};
const toThree = (v) => new THREE.Vector3(v[0], v[2], -v[1]);
let stepState = null;   // { adds: [{rec, explode: Vector3}], box, focusBox, arrows: [] , t, anim }
let labelsOn = true, xray = false, xrayLevel = 78, demo = false, demoT = 0;
const ELEC = new Set(["trigger", "latch", "buck", "switch", "ledring", "shifter", "pi", "cooler", "camera", "bank",
                      "ffc", "wiring", "bank_cable", "usb_p", "usb_n", "usb_m", "uwb_p", "uwb_n", "uwb_m"]);
const camTween = { active: false };

const arrowMat = new THREE.MeshBasicMaterial({ color: GREEN, depthTest: false, transparent: true, opacity: 0.95 });
function makeArrow(from, dir, len) {
  const head = Math.min(16, len * 0.4), shaft = Math.max(1, len - head);
  const g = new THREE.Group();
  const s = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, shaft, 12), arrowMat); s.position.y = shaft / 2;
  const h = new THREE.Mesh(new THREE.ConeGeometry(5, head, 16), arrowMat); h.position.y = shaft + head / 2;
  g.add(s, h); g.renderOrder = 999;
  g.position.copy(from);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  return g;
}

function clearOverlay() {
  overlay.clear(); labelsGroup.traverse((o) => { if (o.isCSS2DObject && o.element.parentNode) o.element.remove(); }); labelsGroup.clear();
}

function showStep(step) {
  const sc = step.scene;
  const show = new Set(sc.show);
  const adds = sc.add.map(([id, ex, ey, ez]) => ({ rec: build(id), explode: new THREE.Vector3(ex, ey, ez) }));
  const addIds = new Set(sc.add.map((a) => a[0]));
  // visibility + materials
  for (const id in built) {
    const r = built[id];
    const vis = show.has(id) || addIds.has(id);
    r.obj.visible = vis;
    r.obj.position.copy(r.seat);
    r.mats.forEach((m) => { m.emissive.setHex(0x000000); m.emissiveIntensity = 0; });
  }
  for (const id of show) build(id).obj.visible = true;
  clearOverlay();
  // bounds
  const box = new THREE.Box3();
  const focusBox = new THREE.Box3();
  for (const id of show) box.union(built[id].box);
  for (const a of adds) {
    box.union(a.rec.box);
    const ex = a.rec.box.clone().translate(toThree(a.explode.toArray()));
    box.union(ex); focusBox.union(a.rec.box); focusBox.union(ex);
  }
  if (focusBox.isEmpty()) focusBox.copy(box);
  // insertion arrows: solid, drawn on top, sitting in the gap between the
  // exploded part and its seat (one per distinct explode vector / part)
  const arrows = [];
  if (sc.arrows !== false) for (const a of adds) {
    if (a.explode.lengthSq() < 1) continue;
    const c = a.rec.box.getCenter(new THREE.Vector3());               // three coords
    const seatCenter = new THREE.Vector3(c.x, -c.z, c.y);             // back to OpenSCAD
    const from = seatCenter.clone().addScaledVector(a.explode, 0.78);
    const ar = makeArrow(from, a.explode.clone().negate().normalize(), a.explode.length() * 0.56);
    overlay.add(ar); arrows.push(ar);
  }
  // callouts
  // marks: a list, or a function returning one when it needs the module's helpers (wirePts)
  for (const [x, y, z, text, ox = 0, oy = 0, oz = 40] of ((typeof sc.marks === "function" ? sc.marks() : sc.marks) || [])) {
    const p = new THREE.Vector3(x, y, z), q = new THREE.Vector3(x + ox, y + oy, z + oz);
    overlay.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p, q]), new THREE.LineBasicMaterial({ color: GREEN })));
    overlay.add(at(new THREE.Mesh(new THREE.SphereGeometry(2.2, 12, 12), new THREE.MeshBasicMaterial({ color: GREEN })), x, y, z));
    const el = document.createElement("div"); el.className = "callout"; el.textContent = text;
    const lab = new CSS2DObject(el); lab.position.copy(q); labelsGroup.add(lab);
  }
  labelsGroup.visible = labelsOn;
  stepState = { adds, box, focusBox, arrows, t: 0, anim: null, focus: sc.focus, focusPad: sc.focusPad ?? 45, view: sc.view || "iso" };
  setXray(!!sc.xray, true);          // each step starts with its own default; the button overrides per step
  setDemo(false, true);
  document.getElementById("btnDemo").classList.remove("on");
  document.getElementById("btnDemo").textContent = "▶ Motion demo";
  applyExplode(0);
  fitView(stepState.view, true);
  if (!sc.stay) replay();
}

function applyExplode(t) {   // t: 0 exploded … 1 assembled
  if (!stepState) return;
  stepState.t = t;
  const e = 1 - (1 - Math.cos(Math.PI * t)) / 2;   // ease-in-out
  for (const a of stepState.adds) a.rec.obj.position.copy(a.rec.seat).addScaledVector(a.explode, e);
  for (const ar of stepState.arrows) ar.visible = t < 0.985;
  document.getElementById("explode").value = Math.round(t * 1000);
}
function replay() {
  if (!stepState) return;
  const start = performance.now() + 350, dur = 1500;
  stepState.anim = (now) => {
    const t = Math.max(0, Math.min(1, (now - start) / dur));
    applyExplode(t);
    if (t >= 1) stepState.anim = null;
  };
}
function setExplode(t) { if (stepState) { stepState.anim = null; applyExplode(t); } }

function fitView(name, immediate) {
  if (!stepState) return;
  const b = stepState.focus === "add" ? stepState.focusBox.clone().expandByScalar(stepState.focusPad) : stepState.box;
  const center = b.getCenter(new THREE.Vector3());
  const dir = toThree(Array.isArray(name) ? name : (VIEWS[name] || VIEWS.iso)).normalize();
  // Fit the box's eight corners inside the frustum for this view direction
  // (a bounding sphere wastes a third of the frame on flat assemblies).
  const z = dir.clone(), up = new THREE.Vector3(0, 1, 0);
  const x = new THREE.Vector3().crossVectors(up, z); if (x.lengthSq() < 1e-6) x.set(1, 0, 0); x.normalize();
  const y = new THREE.Vector3().crossVectors(z, x);
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), th = tv * camera.aspect;
  let dist = 60;
  for (let i = 0; i < 8; i++) {
    const c = new THREE.Vector3(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).sub(center);
    const pz = c.dot(z);
    dist = Math.max(dist, pz + Math.abs(c.dot(x)) / th, pz + Math.abs(c.dot(y)) / tv);
  }
  dist *= 1.1;
  const pos = center.clone().addScaledVector(dir, dist);
  camera.near = Math.max(1, dist / 100); camera.far = dist * 10 + 3000; camera.updateProjectionMatrix();
  if (immediate && !camTween.active && !camTween.done) { camera.position.copy(pos); controls.target.copy(center); camTween.done = true; return; }
  Object.assign(camTween, { active: true, t0: performance.now(), dur: 750, p0: camera.position.clone(), p1: pos, c0: controls.target.clone(), c1: center });
}
function setView(name) { fitView(name, false); }

function setXray(on, silent) {
  xray = on;
  if (!stepState) return;
  const addSet = new Set(stepState.adds.map((a) => a.rec));
  for (const id in built) {
    const r = built[id];
    // the boards, the bank, the servos and the cables stay solid: x-ray is for seeing them through the printed parts
    const ghostPart = on && !addSet.has(r) && !ELEC.has(id), op = 1 - xrayLevel / 100;
    r.mats.forEach((m) => {
      const b = m.userData.base, ghost = ghostPart && !m.userData.elec && op < 1;
      m.transparent = ghost || b.transparent; m.opacity = ghost ? Math.min(op, b.opacity) : b.opacity; m.depthWrite = ghost ? false : b.depthWrite;
      m.needsUpdate = true;
    });
  }
  if (!silent) document.getElementById("btnXray").classList.toggle("on", on);
}
function setXrayLevel(pct) { xrayLevel = pct; if (xray) setXray(true, true); }
function setLabels(on) { labelsOn = on; labelsGroup.visible = on; }
function setDemo(on) { demo = on; if (!on) { demoT = 0; } }


/* ---- catalogue snapshots ---------------------------------------------
   A still picture of one or more PARTS models on their own, for the
   parts-and-tools popup (docs/setup/assembly/catalog.js). */
let snapRenderer = null;
function snapshot(ids) {
  ids = ids.filter((id) => PARTS[id]);
  if (!ids.length) return null;
  if (!snapRenderer) {
    snapRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    snapRenderer.setPixelRatio(1); snapRenderer.setSize(640, 400); snapRenderer.setClearColor(0xf3f5f9);
  }
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x8e96a6, 1.3));
  const kl = new THREE.DirectionalLight(0xffffff, 1.5); kl.position.set(260, 420, 180); sc.add(kl);
  const r = new THREE.Group(); r.rotation.x = -Math.PI / 2; sc.add(r);
  for (const id of ids) {
    const def = PARTS[id];
    let obj;
    if (def.stl) {
      obj = new THREE.Mesh(stlGeometry(def.stl), mat(def.color, { double: def.double }));
      if (def.pos) obj.position.set(...def.pos);
      if (def.rot) obj.rotation.set(...def.rot);
    } else obj = def.build();
    r.add(obj);
  }
  r.updateWorldMatrix(true, true);
  const sphere = new THREE.Box3().setFromObject(r).getBoundingSphere(new THREE.Sphere());
  const cam = new THREE.PerspectiveCamera(30, 640 / 400, 1, 10000);
  const dir = toThree(VIEWS.iso).normalize();
  const dist = Math.max(20, sphere.radius) / Math.sin(THREE.MathUtils.degToRad(15)) * 1.05;
  cam.position.copy(sphere.center).addScaledVector(dir, dist); cam.lookAt(sphere.center);
  cam.near = dist / 100; cam.far = dist * 4; cam.updateProjectionMatrix();
  snapRenderer.render(sc, cam);
  const url = snapRenderer.domElement.toDataURL("image/png");
  sc.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  return url;
}

/* ---- loop -------------------------------------------------------------- */
function resize() {
  const w = stage.clientWidth, h = Math.max(300, Math.round(w * 0.68));
  stage.style.height = h + "px";
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (stepState && stepState.anim) stepState.anim(now);
  if (camTween.active) {
    const u = Math.min(1, (now - camTween.t0) / camTween.dur), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.c0, camTween.c1, e);
    if (u >= 1) camTween.active = false;
  }
  // highlight pulse on this step's parts
  if (stepState) {
    const k = 0.32 + 0.22 * Math.sin(now / 320);
    for (const a of stepState.adds) a.rec.mats.forEach((m) => { m.emissive.copy(ACCENT); m.emissiveIntensity = k; });
  }
  // motion demo
  // Demo sweeps between the soft limits — this axis does not rotate continuously.
  if (demo) {
    demoT += dt;
    groups.pan.rotation.z = THREE.MathUtils.degToRad(80) * Math.sin(demoT * 0.5);
    tiltPivot.rotation.y = -THREE.MathUtils.degToRad(32) * Math.sin(demoT * 0.8) + THREE.MathUtils.degToRad(12);
  }
  else { groups.pan.rotation.z *= 0.9; tiltPivot.rotation.y *= 0.9; }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
requestAnimationFrame(frame);

window.dispatchEvent(new CustomEvent("viewer-ready", { detail: { showStep, replay, setExplode, setView, setXray, setXrayLevel, setLabels, setDemo, snapshot } }));
</script>
</body>
</html>
