<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SportCam — interactive wiring schematic (d3-hwschematic)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📷</text></svg>" />
<!--
  Interactive block-level wiring schematic rendered with d3-hwschematic.
  All libraries are vendored in ./vendor/ (same-origin — the ELK layout
  engine cannot run from a CDN), so this works offline. Drawn for the servo
  drive chosen in the docs viewer's settings (localStorage
  "sportcam-docs-servos", or ?servos=pigpio|arducam): the servos on the Pi's
  PWM through the shifter, or on the PTZ controller. The header's switch
  changes it. Serve it with the docs viewer:

      npm run docs        → http://localhost:8090/schematics/interactive/index.html

  or any static server rooted at the repo or at this directory.
  To re-fetch the vendored libraries: ./update-vendor.sh
-->
<script src="vendor/d3.min.js"></script>
<script src="vendor/elk.bundled.js"></script>
<script src="vendor/d3-hwschematic.js"></script>
<link rel="stylesheet" href="vendor/d3-hwschematic.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; overflow: hidden; }
  header { padding: 10px 16px; background: #1a2233; color: #fff; height: 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
  header .switch { display: flex; gap: 2px; padding: 2px; border: 1px solid #56607a; border-radius: 7px; }
  header .switch button { font: inherit; font-size: 12.5px; padding: 2px 9px; border: 0; border-radius: 5px;
                          background: none; color: #c5cbe0; cursor: pointer; }
  header .switch button[aria-pressed="true"] { background: #2f6fed; color: #fff; }
  #scheme { width: 100vw; height: calc(100vh - 44px); display: block; }
</style>
</head>
<body>
<header><h1>SportCam wiring — base · head · wearable<span id="drive"></span> (drag to pan, wheel to zoom)</h1>
  <div class="switch" role="group" aria-label="Servos driven by">
    <button type="button" data-servos="pigpio">Servos on the Pi</button>
    <button type="button" data-servos="arducam">On the PTZ controller</button>
  </div></header>
<svg id="scheme"></svg>
<script>
// The servo drive: ?servos=…, else the docs viewer's setting, else the Pi
const SERVO_KEY = "sportcam-docs-servos";
const DRIVES = ["pigpio", "arducam"];
let servos = new URLSearchParams(location.search).get("servos");
if (!DRIVES.includes(servos)) {
  try { servos = localStorage.getItem(SERVO_KEY); } catch {}
}
if (!DRIVES.includes(servos)) servos = "pigpio";
const onPi = servos === "pigpio";
for (const btn of document.querySelectorAll("[data-servos]")) {
  btn.setAttribute("aria-pressed", String(btn.dataset.servos === servos));
  btn.addEventListener("click", () => {
    try { localStorage.setItem(SERVO_KEY, btn.dataset.servos); } catch {}
    const url = new URL(location.href);
    url.searchParams.set("servos", btn.dataset.servos);
    location.replace(url);
  });
}
document.getElementById("drive").textContent = onPi ? ", servos on the Pi" : ", servos on the PTZ controller";

const port = (id, name, side) => ({
  id, hwMeta: { name }, direction: side, properties: { side: side === "OUTPUT" ? "EAST" : "WEST" },
});
const node = (id, name, ports, isExternal = false) => ({
  id,
  hwMeta: { name, cls: "Component", isExternalPort: isExternal },
  properties: { "org.eclipse.elk.portConstraints": "FIXED_ORDER" },
  ports,
  children: [],
  edges: [],
});

// Block-level netlist of the whole system
const graph = {
  id: "root",
  hwMeta: { name: "SportCam system", maxId: 1000 },
  properties: { "org.eclipse.elk.hierarchyHandling": "INCLUDE_CHILDREN" },
  ports: [],
  edges: [],
  children: [
    node("bank", "USB-C PD bank 92 Wh", [port("bank_out", "USB-C PD", "OUTPUT")]),
    node("trig", "PD trigger 12 V", [port("tr_in", "USB-C", "INPUT"), port("tr_out", "12V", "OUTPUT")]),
    node("sw", "Rocker switch (on/off)", [port("sw_in", "12V", "INPUT"), port("sw_out", "SW", "OUTPUT")]),
    node("latch", "Power latch (IRF4905)", [
      port("la_in", "12V", "INPUT"), port("la_sw", "SW", "INPUT"), port("la_hold", "HOLD", "INPUT"),
      port("la_out", "12V switched", "OUTPUT"), port("la_sense", "SENSE 2.8 V", "OUTPUT"),
    ]),
    node("ina", "INA260 / INA226 gauge (0x40)", [port("ina_in", "12V", "INPUT"), port("ina_out", "12V", "OUTPUT"), port("ina_i2c", "I2C", "OUTPUT")]),
    node("buck", "Buck 12→5 V 8 A", [port("bk_in", "12V", "INPUT"), port("bk_out", "5V rail", "OUTPUT")]),
    node("pi", "Raspberry Pi 4 — camera unit", [
      port("pi_5v", "USB-C 5V", "INPUT"),
      port("pi_usb1", "USB A1", "INPUT"), port("pi_usb2", "USB A2", "INPUT"), port("pi_usb3", "USB A3", "INPUT"),
      port("pi_csi", "CSI", "OUTPUT"), port("pi_i2c", "I2C G2/G3", "OUTPUT"),
      port("pi_i2c_in", "I2C gauge", "INPUT"),
      port("pi_spi", "SPI0 MOSI G10", "OUTPUT"),
      ...(onPi ? [port("pi_pwm_pan", "PWM0 G12", "OUTPUT"), port("pi_pwm_tilt", "PWM1 G13", "OUTPUT")] : []),
      port("pi_hold", "HOLD G17", "OUTPUT"), port("pi_sense", "SENSE G27", "INPUT"),
    ]),
    node("ptz", onPi ? "Arducam PTZ ctrl (0x0C) — lens" : "Arducam PTZ ctrl (0x0C) — lens, servos", [
      port("ptz_i2c", "I2C", "INPUT"), port("ptz_5v", "5V", "INPUT"),
      port("ptz_zoom", "zoom motor", "OUTPUT"), port("ptz_focus", "focus motor", "OUTPUT"),
      ...(onPi ? [] : [port("ptz_svcc", "servo VCC", "INPUT"),
                       port("ptz_pan", "PAN socket", "OUTPUT"), port("ptz_tilt", "TILT socket", "OUTPUT")]),
    ]),
    node("cam", "Arducam IMX477 + zoom lens", [port("cam_csi", "CSI", "INPUT")]),
    node("pan", "Pan servo ±80°", onPi
      ? [port("pan_in", "signal", "INPUT"), port("pan_5v", "5V", "INPUT")]
      : [port("pan_in", "3-wire lead", "INPUT")]),
    node("tilt", "Tilt servo −45…+85°", onPi
      ? [port("tilt_in", "signal", "INPUT"), port("tilt_5v", "5V", "INPUT")]
      : [port("tilt_in", "3-wire lead", "INPUT")]),
    node("shift", "74AHCT125 3.3→5 V", [
      port("sh_in", "1A", "INPUT"), port("sh_out", "1Y", "OUTPUT"),
      ...(onPi ? [
        port("sh_in2", "2A", "INPUT"), port("sh_out2", "2Y", "OUTPUT"),
        port("sh_in3", "3A", "INPUT"), port("sh_out3", "3Y", "OUTPUT"),
      ] : []),
    ]),
    node("ring", "WS2812B ×16", [port("ring_din", "DIN", "INPUT"), port("ring_5v", "5V", "INPUT")]),
    node("a1", "ULA1 anchor A1 (data)", [port("a1_usb", "USB", "OUTPUT")]),
    node("a2", "ULA1 anchor A2 (power)", [port("a2_usb", "USB", "OUTPUT")]),
    node("a3", "ULA1 anchor A3, mast (power)", [port("a3_usb", "USB", "OUTPUT")]),
    node("tag", "Wearable tag (ULA1 + bank)", [port("tag_rf", "UWB RF", "OUTPUT")], true),
  ],
};

let eid = 0;
const edge = (srcNode, srcPort, dstNode, dstPort, name) => ({
  id: "e" + (eid++), hwMeta: { name },
  sources: [[srcNode, srcPort]], targets: [[dstNode, dstPort]],
});
graph.edges = [
  edge("bank", "bank_out", "trig", "tr_in", "PD negotiate"),
  edge("trig", "tr_out", "latch", "la_in", "12V"),
  edge("trig", "tr_out", "sw", "sw_in", "12V, < 1 mA"),
  edge("sw", "sw_out", "latch", "la_sw", "on/off"),
  edge("latch", "la_out", "ina", "ina_in", "12V"),
  edge("pi", "pi_hold", "latch", "la_hold", "keep on until halted"),
  edge("latch", "la_sense", "pi", "pi_sense", "switch off → shutdown"),
  edge("ina", "ina_out", "buck", "bk_in", "12V sensed"),
  edge("ina", "ina_i2c", "pi", "pi_i2c_in", "battery I2C"),
  edge("buck", "bk_out", "pi", "pi_5v", "5V 5A"),
  edge("buck", "bk_out", "ptz", "ptz_5v", "5V lens motors"),
  ...(onPi ? [
    edge("buck", "bk_out", "pan", "pan_5v", "5V"),
    edge("buck", "bk_out", "tilt", "tilt_5v", "5V"),
  ] : [
    edge("buck", "bk_out", "ptz", "ptz_svcc", "5V servos"),
    edge("ptz", "ptz_pan", "pan", "pan_in", "as the kit came"),
    edge("ptz", "ptz_tilt", "tilt", "tilt_in", "as the kit came"),
  ]),
  edge("buck", "bk_out", "ring", "ring_5v", "5V"),
  edge("pi", "pi_csi", "cam", "cam_csi", "CSI-2"),
  edge("pi", "pi_i2c", "ptz", "ptz_i2c", onPi ? "zoom/focus" : "zoom/focus/pan/tilt"),
  ...(onPi ? [
    edge("pi", "pi_pwm_pan", "shift", "sh_in2", "pan PWM 3.3 V"),
    edge("shift", "sh_out2", "pan", "pan_in", "pan PWM 5 V"),
    edge("pi", "pi_pwm_tilt", "shift", "sh_in3", "tilt PWM 3.3 V"),
    edge("shift", "sh_out3", "tilt", "tilt_in", "tilt PWM 5 V"),
  ] : []),
  edge("pi", "pi_spi", "shift", "sh_in", "SPI MOSI"),
  edge("shift", "sh_out", "ring", "ring_din", "WS2812 data"),
  edge("a1", "a1_usb", "pi", "pi_usb1", "serial: all 3 ranges"),
  edge("a2", "a2_usb", "pi", "pi_usb2", "5 V only"),
  edge("a3", "a3_usb", "pi", "pi_usb3", "5 V only"),
];

const svg = d3.select("#scheme")
  .attr("width", window.innerWidth)
  .attr("height", window.innerHeight - 44);
const schematic = new d3.HwSchematic(svg);
const zoom = d3.zoom().on("zoom", (ev) => schematic.root.attr("transform", ev.transform));
svg.call(zoom).on("dblclick.zoom", null);
schematic.bindData(graph).then(
  () => {},
  (err) => { document.querySelector("header h1").textContent = "layout error: " + err; },
);
</script>
</body>
</html>
