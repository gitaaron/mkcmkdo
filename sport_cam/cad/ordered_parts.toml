# SportCam — sizes of the parts you buy.
#
# The CAD, the layout and the fit audit are all built from these numbers.
# Most are typical figures for the part in the bill of materials, NOT
# measurements of yours. The ones you need to measure are marked MEASURE_TODO
# (the rest are fixed by the part's spec, or too small an error to matter).
# When a part arrives:
#
#   1. measure each marked value with calipers and enter it,
#   2. change its MEASURE_TODO to MEASURE_DONE,
#   3. run  python3 cad/fit.py  from sport_cam/.
#
# fit.py and cad/printer.py list every part that still has a MEASURE_TODO.
#
# fit.py re-solves the layout for both builds (where each board sits, which
# way the Pi faces, how tall the enclosure is, …), regenerates the CAD,
# re-renders the STLs and audits that every part fits together and prints on
# a Bambu Lab A1 Mini. If the new sizes don't fit the current arrangement it
# looks for one that does — other positions and orientations, a taller
# enclosure, a wider one up to what the A1 Mini can print — and says what it
# changed. If nothing fits, it names the part and the constraint. The result
# of the last run is in cad/FIT_REPORT.md.
#
# All lengths in mm. Unless noted: l = long side, w = short side, h = overall
# height including the tallest component. "bom" is the item number in the
# bill of materials; "builds" limits a part to one build (default: both).

# ---- compute -------------------------------------------------------------

[pi]
name = "Raspberry Pi 4 Model B"
bom = 2
l = 85                # board; x runs from the microSD end (0) to the USB/Ethernet end
w = 56                # y runs from the power/HDMI edge (0) to the GPIO edge
pcb_t = 1.6
holes = [[3.5, 3.5], [61.5, 3.5], [3.5, 52.5], [61.5, 52.5]]   # M2.5, from the microSD end / power edge
hole_d = 2.7
under_h = 2.5         # solder joints and the microSD socket under the board
heatsink_h = 10       # MEASURE_TODO  stick-on heatsinks (item 3); a fan case is taller — enter its height
port_block_l = 24     # USB + Ethernet jacks, measured in from the USB end
port_h = 16           # their height above the board
port_overhang = 3     # how far they stick out past the board edge
gpio_x0 = 7           # GPIO header, from the microSD end
gpio_x1 = 58
gpio_w = 7            # header depth in from the GPIO edge
gpio_lead_h = 16      # Dupont leads on the header, above the board
usbc_x = 11.2         # USB-C power socket centre, from the microSD end, on the power edge
plug_w = 12           # USB-C plug overmould of the pigtail
plug_h = 7
plug_l = 20           # plug and strain relief, before the cable bends down through the shelf gap
standoff_h = 6        # M2.5 nylon standoffs it sits on (item 21)

[shifter]
name = "74AHCT125 level shifter on a 2 × 8 cm perfboard"
bom = 8
# Built on a 2 × 8 cm board (6 × 28 holes) from the ELEGOO kit (13a.10), like the
# power latch on its 3 × 7. It stands on four M3 standoffs, and countersunk screws
# come up through the shelf (or the floor, if fit.py puts it there) into them.
l = 80                # MEASURE_TODO  the board's long side
w = 20                # MEASURE_TODO  its short side
h = 22                # MEASURE_TODO  from the bottom of the standoffs to the top of the tallest part: the servo plugs on their headers
hole_dx = 76          # MEASURE_TODO  corner hole centre to centre, along l
hole_dy = 16          # MEASURE_TODO  and along w
screw_d = 3           # MEASURE_TODO  3 for M3 — drill the corner holes to 3.2 mm if an M3 screw won't pass
standoff_h = 6        # MEASURE_TODO  the M3 standoffs under it (item 21): enough to clear the solder joints underneath

# ---- power ---------------------------------------------------------------

[pd_trigger]
name = "USB-C PD trigger board, 12 V"
bom = 10
# It stands on two M3 standoffs through the holes at its socket end, screwed up
# through the power drum's floor; a printed rest holds up the terminal end.
l = 33                # MEASURE_TODO  the USB-C socket is at one short end
w = 14                # MEASURE_TODO
h = 18                # MEASURE_TODO  from the bottom of the standoffs to the top of the tallest part (the screw terminal)
pcb_t = 1.6           # MEASURE_TODO  the board's thickness
port_h = 3.3          # MEASURE_TODO  the socket's height, sitting on top of the board at that end
hole_x = 4            # MEASURE_TODO  from the socket end of the board to the centres of its two holes
hole_dy = 9           # MEASURE_TODO  the two holes, centre to centre, across the board
screw_d = 3           # MEASURE_TODO  3 for M3, 2.5 for M2.5: the biggest that passes the holes
standoff_h = 6        # MEASURE_TODO  the standoffs under it (item 21): enough to clear the solder joints underneath
plug_w = 12.5         # MEASURE_TODO  the bank cable's USB-C plug overmould — room is kept for it in front of the socket
plug_h = 7            # MEASURE_TODO

[buck]
name = "12 V → 5 V 8 A adjustable buck"
bom = 11
# It stands on edge on four brass standoffs, one in each corner, against a wall of
# the bank pocket in the power drum; M3 countersunk screws come through the wall
# into them. On edge, w is its height and h how far it stands out from the wall.
l = 80                # MEASURE_DONE  the board outline, or anything hanging over its edge, whichever is bigger
w = 50                # MEASURE_DONE
h = 28.2              # MEASURE_DONE  from the bottom of the standoffs to the top of the tallest part
hole_dx = 73.74       # MEASURE_DONE  standoff centre to centre, along l
hole_dy = 44.35       # MEASURE_DONE  and along w
screw_d = 3           # MEASURE_DONE  the standoffs' thread: 3 for M3, 2.5 for M2.5

[latch]
name = "Power latch (P-MOSFET and two transistors on a 3 × 7 cm double-sided perfboard)"
bom = "13a"
# Built on the 3 × 7 cm board from an ELEGOO double-sided PCB kit (or any perfboard
# with a hole in each corner). Like the buck, it stands on edge on four M3 standoffs,
# one in each corner, against a wall of the bank pocket, screwed through the wall.
l = 70                # MEASURE_TODO  the board's long side
w = 30                # MEASURE_TODO  its short side
h = 18                # MEASURE_TODO  from the bottom of the standoffs to the top of the tallest part (IRF4905 bent over flat)
hole_dx = 66          # MEASURE_TODO  corner hole centre to centre, along l
hole_dy = 26          # MEASURE_TODO  and along w
screw_d = 3           # MEASURE_TODO  3 for M3 — drill the board's corner holes to 3.2 mm if an M3 screw won't pass
standoff_h = 8        # MEASURE_TODO  the M3 standoffs under it (item 21): enough to clear the solder joints underneath

[switch]
name = "Round panel-mount rocker switch, threaded, with a locking ring"
bom = 13
hole_d = 24           # MEASURE_TODO  the threaded body's outside diameter — the wall hole is cut 0.5 mm bigger
hole_d_minus_flat = 22 # MEASURE_TODO  across the thread from its key flat to the far side — the hole gets a matching flat
flat_side = "bottom"  # MEASURE_TODO  where the key flat is, looking at the front with ON at the top: top, bottom, left or right
flange_d = 32         # MEASURE_TODO  the round bezel on the front — a flat seat is cut into the curved wall for it
nut_d = 32            # MEASURE_TODO  the ring that screws on the back, across its lugs
nut_t = 6             # MEASURE_TODO  the ring's thickness
thread_l = 12         # MEASURE_TODO  from the back of the bezel to the end of the thread
depth = 26            # MEASURE_TODO  from the back of the bezel to the tips of the terminals

[power_bank]
name = "USB-C PD power bank, 25 000 mAh"
bom = 9
l = 114.8               # MEASURE_DONE
w = 75.5                # MEASURE_DONE
h = 36.2                # MEASURE_DONE

# ---- status light --------------------------------------------------------

[led_ring]
name = "WS2812B 16-LED ring"
bom = 7
od = 44.5
id = 31.75
h = 3.5               # board plus LEDs
count = 16

# ---- camera --------------------------------------------------------------

[ptz]
name = "Arducam IMX477 PTZ camera, metal pan-tilt base"
bom = 1
# The base is a round turntable standing on four brass standoffs, with the pan
# servo hanging underneath between them. It stays on those standoffs: M3 screws
# come up through the lid's slots into them. Every cable leaves from the camera
# head at the top (not through the base), so the lid has a cable slot at the back.
# The four standoffs make a rectangle, lined up with the lens. Look down on the base
# with the lens pointing straight ahead at mid-pan and measure centre to centre:
horizontal_bolt_spacing = 76.5   # MEASURE_DONE  side to side — the two standoffs left and right of each other
vertical_bolt_spacing = 76.5     # MEASURE_DONE  front to back — the two standoffs one behind the other
                                 # (corner to corner, the lid slots take 70–104)
base_d = 120          # MEASURE_DONE  the turntable's bottom disc, across
standoff_h = 32       # MEASURE_DONE  the brass standoffs under it; their bottom ends take an M3 screw (try one before printing)
servo_drop = 30.8       # MEASURE_DONE  how far the pan servo hangs below the bottom disc
tilt_axis_h = 38      # MEASURE_DONE  underside of the bottom disc up to the tilt axis
bolt_l = 12           # MEASURE_DONE  the M3 screws you fix it with, up through the lid into the standoffs
head_d = 5.3          # MEASURE_DONE  their heads (pan or cap head)
head_h = 3.1          # MEASURE_DONE
ribbon_w = 16         # MEASURE_DONE  the camera ribbon (15-pin FFC)
ribbon_l = 500        # MEASURE_DONE  its length, end to end — it has to reach from the camera board, over the base, to the Pi
lead_bundle_d = 8     # MEASURE_DONE  the I2C/5 V lead (and the servo leads, if the Pi drives them), bunched

