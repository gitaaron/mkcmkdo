<script>
const SECTIONS = [["Power, 12 V side", [["P1", "Power bank USB-C", "PD trigger USB-C", "30 cm C-to-C cable (BOM 14). A charge-only or A-to-C cable leaves the trigger at 5 V", "#5b6475"], ["P2", "PD trigger +12 V", "power latch IN", "18 AWG. The latch switches the positive line only", "#c0392b"], ["P3", "power latch OUT", "gauge VIN+ (IN+ on an INA226)", "18 AWG. The gauge sits in series on the positive line", "#c0392b"], ["P4", "gauge VIN− (IN−)", "buck IN+", "18 AWG", "#c0392b"], ["P5", "PD trigger GND", "buck IN−", "18 AWG", "#222222"], ["P6", "power latch GND", "buck IN−", "22 AWG. The latch only references its transistors to it", "#222222"]]], ["Switch and Pi signals", [["S1", "latch IN (+12 V, always live)", "rocker terminal 1", "22 AWG, signal only: under 1 mA", "#c0392b"], ["S2", "rocker terminal 2", "latch SW", "22 AWG", "#c0392b"], ["S3", "latch HOLD", "Pi pin 11 (GPIO17)", "Dupont. The Pi&#x27;s &quot;keep the power on&quot; line", "#7d3cbd"], ["S4", "latch SENSE", "Pi pin 13 (GPIO27)", "Dupont. 2.8 V: check it&#x27;s under 3.3 V before plugging it in", "#7d3cbd"]]], ["Power, 5 V rail", [["R1", "buck OUT+ / OUT−", "470 µF capacitor", "across the output, stripe (−) to OUT−", "#d64541"], ["R2", "buck OUT+ / OUT−", "USB-C pigtail → Pi USB-C", "18 AWG, short. ≈ 1.2 A average, 2 A peaks", "#d64541"], ["R3", "buck OUT+ / OUT−", "PTZ controller 5V / GND", "18–22 AWG. Not the Pi&#x27;s 5 V pin", "#d64541"], ["R4", "buck OUT+ / OUT−", "LED ring 5V / GND", "22 AWG", "#d64541"], ["R5", "buck OUT+ / OUT−", "74AHCT125 VCC (pin 14) / GND (pin 7)", "22 AWG", "#d64541"], ["R6", "buck OUT+ / OUT−", "panel barrel jack", "22 AWG. Optional 5 V service tap, centre positive", "#d64541"], ["R7", "buck OUT+ / OUT−", "servo headers + / −", "20–22 AWG. ≈ 0.7 A when both servos stall", "#d64541"]]], ["I2C bus", [["I1", "Pi pin 3 (GPIO2, SDA)", "PTZ controller SDA and gauge SDA", "PTZ controller 0x0C, gauge 0x40", "#2f6fed"], ["I2", "Pi pin 5 (GPIO3, SCL)", "PTZ controller SCL and gauge SCL", "", "#e0a100"], ["I3", "Pi pin 1 (3.3 V)", "gauge VCC", "3.3 V, not 5 V: the gauge&#x27;s pull-ups go to its VCC", "#e67e7e"], ["I4", "Pi pin 9 (GND)", "gauge GND", "", "#222222"]]], ["LED ring", [["L1", "Pi pin 19 (GPIO10, SPI0 MOSI)", "74AHCT125 1A (pin 2)", "3.3 V data in", "#16a085"], ["L2", "74AHCT125 1Y (pin 3)", "ring DIN", "5 V data out. Keep it short. DIN, not DOUT", "#16a085"], ["L3", "74AHCT125 1OE (pin 1)", "GND", "active-low enable, tied low", "#222222"], ["L4", "74AHCT125 4A (pin 12) and 4OE (pin 13)", "GND", "the unused gate: a floating input oscillates", "#222222"]]], ["Servos", [["M1", "Pi pin 32 (GPIO12, PWM0)", "74AHCT125 2A (pin 5)", "pan signal, 3.3 V", "#e67e22"], ["M2", "Pi pin 33 (GPIO13, PWM1)", "74AHCT125 3A (pin 9)", "tilt signal, 3.3 V", "#e67e22"], ["M3", "74AHCT125 2OE (pin 4) and 3OE (pin 10)", "GND", "active-low enables, tied low", "#222222"], ["M4", "74AHCT125 2Y (pin 6)", "pan header S", "5 V pulses", "#e67e22"], ["M5", "74AHCT125 3Y (pin 8)", "tilt header S", "", "#e67e22"], ["M6", "both headers + and −", "the 5 V rail (R7)", "links the second header to the first", "#d64541"], ["M7", "pan and tilt servo leads", "pan and tilt headers", "off the PTZ controller. Brown/black = GND, red = +5 V", "#8d5524"]]], ["Camera and PTZ", [["C1", "camera ribbon (15-pin)", "Pi CSI connector", "silver contacts toward the HDMI ports", "#b8bec9"], ["C2", "PTZ controller lens leads", "zoom and focus motors", "factory-wired, as the kit came", "#7a7f8a"]]]];
const svg = document.querySelector("#pic svg");
const rows = document.getElementById("rows");
const wiresOf = (id) => svg.querySelectorAll(`.wire[data-c="${id}"]`);

for (const [title, conns] of SECTIONS) {
  rows.insertAdjacentHTML("beforeend", `<tr class="sec"><td colspan="4">${title}</td></tr>`);
  for (const [id, from, to, notes, colour] of conns) {
    const tr = document.createElement("tr");
    tr.className = "c"; tr.dataset.c = id; tr.tabIndex = 0;
    tr.innerHTML = `<td class="id"><span>${id}</span></td><td>${from}</td><td>${to}</td><td class="n">${notes}</td>`;
    tr.querySelector("span").style.background = colour;
    if (["#e0a100", "#b8bec9"].includes(colour)) tr.querySelector("span").style.color = "#1a2233";
    rows.append(tr);
  }
}

let current = null;
function select(id, scroll) {
  current = id === current ? null : id;
  svg.classList.toggle("focus", !!current);
  svg.querySelectorAll(".wire.on").forEach((g) => g.classList.remove("on"));
  rows.querySelectorAll("tr.on").forEach((r) => r.classList.remove("on"));
  if (!current) return;
  wiresOf(current).forEach((g) => { g.classList.add("on"); g.parentNode.append(g); });
  const tr = rows.querySelector(`tr[data-c="${current}"]`);
  if (tr) { tr.classList.add("on"); if (scroll) tr.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}
rows.addEventListener("click", (e) => { const tr = e.target.closest("tr.c"); if (tr) select(tr.dataset.c); });
rows.addEventListener("keydown", (e) => {
  const tr = e.target.closest("tr.c");
  if (!tr) return;
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(tr.dataset.c); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const all = [...rows.querySelectorAll("tr.c")].filter((r) => r.style.display !== "none");
    const next = all[all.indexOf(tr) + (e.key === "ArrowDown" ? 1 : -1)];
    if (next) { next.focus(); current = null; select(next.dataset.c, true); }
  }
});
rows.addEventListener("mouseover", (e) => {
  const tr = e.target.closest("tr.c");
  svg.querySelectorAll(".wire.peek").forEach((g) => g.classList.remove("peek"));
  if (tr) wiresOf(tr.dataset.c).forEach((g) => g.classList.add("peek"));
});
rows.addEventListener("mouseleave", () => svg.querySelectorAll(".wire.peek").forEach((g) => g.classList.remove("peek")));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && current) select(current); });

document.getElementById("q").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  let sec = null, any = false;
  const flush = () => { if (sec) sec.style.display = any ? "" : "none"; };
  for (const tr of rows.children) {
    if (tr.classList.contains("sec")) { flush(); sec = tr; any = false; continue; }
    const hit = !q || tr.textContent.toLowerCase().includes(q);
    tr.style.display = hit ? "" : "none";
    any ||= hit;
  }
  flush();
});

// Pan and zoom by moving the viewBox; a click without a drag picks a wire
const pic = document.getElementById("pic");
const home = svg.viewBox.baseVal;
let vb = [home.x, home.y, home.width, home.height];
const show = () => svg.setAttribute("viewBox", vb.join(" "));
const toSvg = (cx, cy) => {
  const r = svg.getBoundingClientRect();
  const s = Math.max(vb[2] / r.width, vb[3] / r.height);
  return [vb[0] + vb[2] / 2 + (cx - r.left - r.width / 2) * s, vb[1] + vb[3] / 2 + (cy - r.top - r.height / 2) * s, s];
};
const fit = () => { vb = [home.x, home.y, home.width, home.height]; show(); };
document.getElementById("fit").addEventListener("click", fit);
svg.removeAttribute("width"); svg.removeAttribute("height");
fit();
pic.addEventListener("wheel", (e) => {
  e.preventDefault();
  const [x, y] = toSvg(e.clientX, e.clientY);
  const k = Math.exp(e.deltaY * 0.0015);
  const w = Math.min(home.width * 1.5, Math.max(home.width / 12, vb[2] * k));
  const f = w / vb[2];
  vb = [x - (x - vb[0]) * f, y - (y - vb[1]) * f, vb[2] * f, vb[3] * f];
  show();
}, { passive: false });
let drag = null;
pic.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, vb: [...vb], moved: false }; pic.setPointerCapture(e.pointerId); });
pic.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; pic.classList.add("drag");
  const s = toSvg(0, 0)[2];
  vb = [drag.vb[0] - dx * s, drag.vb[1] - dy * s, vb[2], vb[3]];
  show();
});
pic.addEventListener("pointerup", (e) => {
  pic.classList.remove("drag");
  const was = drag; drag = null;
  if (!was || was.moved) return;
  const hit = document.elementsFromPoint(e.clientX, e.clientY).map((el) => el.closest && el.closest(".wire")).find(Boolean);
  if (hit) select(hit.dataset.c, true);
  else if (current) select(current);
});
</script>
