<script>
/* =====================================================================
   Assembly data. Coordinates are OpenSCAD-space millimetres, matching
   cad/config.scad (Z up, lens axis +X, tilt axis Y).
   ===================================================================== */
// The layout cad/fit.py solved from the part sizes (layout.js, generated).
const LY = window.SPORTCAM_LAYOUT;
const LID_Z = LY.lid_z;           // lid ring drops into the enclosure mouth
const LID_TOP = LY.lid_top;       // top face of the lid — the PTZ base bolts here
const TILT_Z = LY.tilt_z;         // tilt axis of the Arducam base
const SHELF_Z = LY.shelf_z;       // underside of the Pi shelf
const BAND_Z = LY.window_z - LY.design.diffuser_lip;   // bottom of the diffuser band
// where a wall feature is, in words: +X is the lens, +Y is on your left behind the camera
const where = (a) => ["front", "front-left", "left side", "back-left", "back", "back-right", "right side", "front-right"][Math.round((((a % 360) + 360) % 360) / 45) % 8];
const bx = (k) => LY.boxes[k];

const PHASES = ["Prepare", "Enclosure", "Camera", "Power & cables", "Finish"];

// part groups, in assembly order
const SHELL = ["base_housing", "insert"];
const POWER = ["jack", "trigger", "switch", "ina226", "buck", ...(LY.shifter_on === "deck" ? ["shifter"] : [])];
const SHELF = ["shelf", "ledring", ...(LY.shifter_on === "shelf" ? ["shifter"] : [])];
const PI = ["pi", "cooler"];
const LED = ["led_diffuser_ring"];
const HEAD = ["lid", "ptz_plate", "ptz_pan", "ptz_yoke", "camera", "lens"];
const BATT = ["battery_tray", "bank"];
const CABLES = ["ffc", "pwr_pi", "i2c_lead"];
const lift = (ids, dz) => ids.map((id) => [id, 0, 0, dz]);

const STEPS = [
  {

    parts: ["All 5 printed bodies (≈ 300 g PETG) — settings and filament in <a href='../../../../docs/setup/11-3d-printing.md' target='_blank'>printer specifications</a>", "M2.5 / M3 screw kit + brass heat-set inserts", "Calipers"],
    tools: ["3D printer", "Calipers", "Soldering iron (for inserts)", "3.2 mm drill bit, flush cutters"],
    steps: [

      "<b>Print:</b> enclosure — PETG, 4 walls, 20 %, no supports · <b>lid — 5 walls, 40 %</b>, it carries the whole camera · shelf — 3 walls, 20 %, white or natural if you have it · diffuser band — white PETG, 2 walls, 0 % infill · battery tray — 3 walls, 20 %.",

      "<b>Dry-fit</b> the lid ring in the enclosure mouth, the shelf on its three posts, the diffuser band over the window, and the bank in the tray.",

  },
  {
    id: "power", phase: 1, title: "Power boards onto the floor", time: "60 min",

    parts: ["Shelf", "WS2812B 16-LED ring", "74AHCT125 level shifter", "LED diffuser ring (white PETG)", "Double-sided foam tape", "CA or hot glue"],
    tools: ["Soldering iron"],
    steps: [
      "<b>Wiring:</b> connections R4, R5 and L1–L4 in the <a href='../12-wiring.md' target='_blank'>wiring guide</a>, with the 74AHCT125 pin numbers.",
      "Data comes out of <b>SPI0 MOSI, GPIO10</b>, not the classic <code>rpi_ws281x</code> PWM/DMA pin. A Pi 4 can do it either way, but the PWM driver needs the whole camera service to run as root and SPI does not.",
      "<b>Ring:</b> foam-tape it to the <b>underside</b> of the shelf, <b>LEDs facing down</b>, centred on the shelf's small centre hole. It then sits in the band of the LED window, between the power boards and the shelf, and lights the window all the way round. Take its leads round the edge of the shelf through the cut-away side.",
      LY.shifter_on === "shelf"
        ? "<b>Shifter:</b> foam-tape it to the top of the shelf where the model shows, beside the Pi's place. Wire GPIO10 → 74AHCT125 input, its output → ring DIN. Tie the shifter's unused inputs to ground and power it from 5 V. Ring 5 V and ground come from the buck, not the Pi."
        : "<b>Shifter:</b> foam-tape it to the floor where the model shows. Wire GPIO10 → 74AHCT125 input, its output → ring DIN. Tie the shifter's unused inputs to ground and power it from 5 V. Ring 5 V and ground come from the buck, not the Pi.",

      "Fit the heatsinks to the Pi <b>before</b> mounting it. It sits in a closed enclosure and you won't reach the chips afterwards. A fan case is taller: put its height in <code>ordered_parts.toml</code> and re-run <code>fit.py</code> first.",
      "Flash the card and enable I2C and SPI in <code>raspi-config</code>. If the camera is not detected on first boot, add <code>dtoverlay=imx477</code> to <code>/boot/firmware/config.txt</code>. The <code>usb_max_current_enable</code> flag is a Pi 5 thing and is not needed here.",
      "Screw the four 6 mm nylon standoffs into the shelf's Pi holes from underneath and mount the Pi on them with M2.5 × 6 — USB-C socket towards the shelf's cut-away side.",
      "Feed the buck's 5 V pigtail, the gauge's I2C leads and the PTZ controller's 5 V up through the cut-away side, lower the shelf onto its three posts, and fix it with 3 × M3 × 8 into the inserts in their tops.",

    ],
    scene: { show: [...SHELL, ...POWER, ...LED], add: lift([...SHELF, ...PI], 70),
             view: "iso-high", focus: "all", render: "pi",
             marks: [[LY.pi.x, LY.pi.y, LY.pi.z + 12, "Pi 4 on the shelf", -70, 25, 45],
                     [LY.post_r * Math.cos(LY.post_angs[0] * Math.PI / 180), LY.post_r * Math.sin(LY.post_angs[0] * Math.PI / 180), SHELF_Z, "shelf post", 30, 30, 30]] },
  },
  {
    id: "lid-ptz", phase: 2, title: "Arducam base onto the lid", time: "25 min",
    parts: ["Lid", "Arducam IMX477 PTZ camera with metal pan-tilt base", "4 × M3 × 10 + nuts"],
    tools: ["Calipers", "Marker", "2.5 mm hex key"],
    steps: [
      "Measure the base's bolt spacing. The lid's four radial slots accept 30–72 mm; if yours is outside that, change <code>ptz_bolt_min/max</code> in <code>cad/config.scad</code> and reprint the lid.",

      "Pass the camera ribbon and the servo/I2C lead <b>down through the central opening first</b>, then bolt the base down with M3 and nuts. Doing it the other way round means undoing the bolts again.",
      "Check the base can sweep both axes fully without the ribbon pulling. Leave about 80 mm of slack coiled under the lid.",
    ],
    warn: "Do not overtighten. The base plate is thin aluminium and the lid is plastic; snug plus a nylon-insert nut holds better than crushing the lid.",
    scene: { show: ["lid"], add: [["ptz_plate", 0, 0, 60], ["ptz_pan", 0, 0, 60], ["ptz_yoke", 0, 0, 60], ["camera", 0, 0, 60], ["lens", 0, 0, 60]],
             view: "iso-high", focus: "all", render: "lid-ptz",
             marks: [[0, 0, LID_TOP + 3, "slots take 30–72 mm bolt spacing", -75, -45, 42], [40, 0, TILT_Z, "lens points +X at pan centre", 35, -40, 35]] },
  },
  {

    parts: ["Lid assembly", "4 × M3 × 8 countersunk"],

      "Connect the leads waiting on the shelf: PTZ controller 5 V and ground to the buck's 5 V (brought up through the shelf's cut-away side), SDA and SCL to Pi GPIO 2/3 alongside the gauge.",

    parts: ["Battery tray", "USB-C PD power bank, 25 000 mAh (92 Wh)", "Hook-and-loop strap", "100 W USB-C cable, 30 cm"],
    tools: [],
    steps: [

      "Strap the tray to a tripod leg or the centre column, as low as is convenient. The mass ends up low, which is what keeps the rig stable with the camera above it. (There is no sandwich mount: the bolt would have to go through the bank.)",

/* =====================================================================
   UI (framework-free). Works before/without the 3D viewer; the viewer
   registers itself via the 'viewer-ready' event.
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const STORE_KEY = "sportcam-assembly-done";
let current = 0;
let done = new Set();
let viewer = null;          // { showStep(step), replay(), setExplode(t), setView(name), setXray(b), setLabels(b), setDemo(b) }

try { done = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (e) { /* storage unavailable */ }
function saveDone() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...done])); } catch (e) { /* ignore */ } }

function buildNav() {
  const nav = $("stepNav");
  const sel = $("stepSelect");
  let html = "";
  let selHtml = "";
  PHASES.forEach((ph, pi) => {
    html += `<div class="phase">${pi + 1}. ${ph}</div><ol>`;
    STEPS.forEach((s, i) => {
      if (s.phase !== pi) return;
      html += `<li><button data-i="${i}" id="nav-${s.id}"><span class="n">${i + 1}</span><span><span class="t">${s.title}</span><span class="meta">${s.time}</span></span></button></li>`;
      selHtml += `<option value="${i}">${i + 1}. ${s.title}</option>`;
    });
    html += "</ol>";
  });
  nav.innerHTML = html;
  sel.innerHTML = selHtml;
  nav.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => go(+b.dataset.i)));
  sel.addEventListener("change", () => go(+sel.value));
}

// Names of parts and tools become buttons that open a picture and a
// description (docs/setup/assembly/catalog.js, shared by both builds).
const linkify = (x) => (window.SportcamCatalog ? SportcamCatalog.linkify(x) : x);
function list(items) { return items.length ? "<ul>" + items.map((x) => `<li>${linkify(x)}</li>`).join("") + "</ul>" : "<p class='muted'>none</p>"; }

function renderDetail(s) {
  let h = "";
  if (s.warn) h += `<div class="warn"><strong>Check:</strong> ${s.warn}</div>`;
  h += `<div class="panel"><h3>Do this</h3><ol>${s.steps.map((x) => `<li>${x}</li>`).join("")}</ol></div>`;
  if (s.note) h += `<div class="note"><strong>Tip:</strong> ${s.note}</div>`;
  const hint = window.SportcamCatalog ? `<span class="cat-hint">tap a name for a picture</span>` : "";
  h += `<div class="panel two"><div><h3>Parts${hint}</h3>${list(s.parts)}</div><div><h3>Tools</h3>${list(s.tools)}</div></div>`;
  $("detail").innerHTML = h;
}

function updateProgress() {
  $("progressLabel").textContent = `${done.size} / ${STEPS.length} done`;
  $("progressBar").style.width = (100 * done.size / STEPS.length) + "%";
  STEPS.forEach((s, i) => {
    const b = $("nav-" + s.id);
    b.classList.toggle("done", done.has(s.id));
    b.classList.toggle("active", i === current);
  });
  const isDone = done.has(STEPS[current].id);
  $("btnDone").textContent = isDone ? "✓ Done" : "✓ Mark done";
  $("btnDone").classList.toggle("done", isDone);
}

function go(i, replaceHash) {
  current = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[current];
  $("stepTitle").textContent = `${current + 1}. ${s.title}`;
  $("stepPhase").textContent = PHASES[s.phase];
  $("stepTime").textContent = s.time;
  $("stepSelect").value = current;
  renderDetail(s);
  $("btnPrev").disabled = current === 0;
  $("btnNext").textContent = current === STEPS.length - 1 ? "Finish" : "Next →";
  $("btnDemo").hidden = !s.scene.demo;
  $("btnXray").classList.toggle("on", !!s.scene.xray);
  $("explode").value = 1000;
  updateProgress();
  if (viewer) viewer.showStep(s);
  const h = "#" + s.id;
  if (location.hash !== h) { if (replaceHash) history.replaceState(null, "", h); else location.hash = h; }
  const nb = $("nav-" + s.id); if (nb) nb.scrollIntoView({ block: "nearest" });
  $("main").scrollTo({ top: 0, behavior: "smooth" });
}

function stepFromHash() {
  const id = location.hash.slice(1);
  const i = STEPS.findIndex((s) => s.id === id);
  return i < 0 ? 0 : i;
}

$("btnPrev").addEventListener("click", () => go(current - 1));
$("btnNext").addEventListener("click", () => {
  if (current === STEPS.length - 1) { done.add(STEPS[current].id); saveDone(); updateProgress(); return; }
  go(current + 1);
});
$("btnDone").addEventListener("click", () => {
  const id = STEPS[current].id;
  if (done.has(id)) done.delete(id); else done.add(id);
  saveDone(); updateProgress();
});
$("btnReplay").addEventListener("click", () => viewer && viewer.replay());
$("explode").addEventListener("input", (e) => viewer && viewer.setExplode(e.target.value / 1000));
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => viewer && viewer.setView(b.dataset.view)));
$("btnXray").addEventListener("click", () => { const b = $("btnXray"); b.classList.toggle("on"); viewer && viewer.setXray(b.classList.contains("on")); });
$("btnLabels").addEventListener("click", () => { const b = $("btnLabels"); b.classList.toggle("on"); viewer && viewer.setLabels(b.classList.contains("on")); });
$("btnDemo").addEventListener("click", () => { const b = $("btnDemo"); b.classList.toggle("on"); b.textContent = b.classList.contains("on") ? "■ Stop demo" : "▶ Motion demo"; viewer && viewer.setDemo(b.classList.contains("on")); });

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (document.querySelector("dialog[open]")) return;   // a part's picture is open
  if (e.key === "ArrowRight") go(current + 1);
  else if (e.key === "ArrowLeft") go(current - 1);
  else if (e.key.toLowerCase() === "d") $("btnDone").click();
  else if (e.key.toLowerCase() === "r") $("btnReplay").click();
  else if (e.key.toLowerCase() === "x") $("btnXray").click();
  else if (e.key.toLowerCase() === "l") $("btnLabels").click();
});
window.addEventListener("hashchange", () => { const i = stepFromHash(); if (i !== current) go(i, true); });

window.addEventListener("viewer-ready", (e) => {
  viewer = e.detail;
  if (window.SportcamCatalog) SportcamCatalog.snapshot = viewer.snapshot;
  $("stageMsg").remove();
  viewer.setXray($("btnXray").classList.contains("on"));
  viewer.showStep(STEPS[current]);
});
window.addEventListener("viewer-failed", (e) => {
  // No WebGL or no internet for three.js: fall back to the pre-rendered
  // turntables in renders/ (python3 docs/setup/assembly/render_steps.py).
  $("stageMsg").remove();
  $("stageHint").textContent = "offline mode · drag to spin between pre-rendered views";
  document.querySelectorAll(".viewer-bar").forEach((el) => el.hidden = true);
  viewer = makeTurntable($("stage"));
  viewer.showStep(STEPS[current]);
  console.warn("3D viewer unavailable, using pre-rendered turntable:", e.detail);
});

function makeTurntable(stage) {
  const N = 8;
  const img = document.createElement("img");
  img.alt = "assembly step rendering";
  stage.prepend(img);
  let frame = 5, base = "";
  const set = (f) => { frame = ((f % N) + N) % N; img.src = `renders/${base}_${frame}.png`; };
  img.onerror = () => { img.alt = "No pre-rendered view for this step. Run: python3 docs/setup/assembly/render_steps.py"; };
  let drag = null;
  stage.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, f: frame }; stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", (e) => { if (drag) set(drag.f + Math.round((e.clientX - drag.x) / 40)); });
  stage.addEventListener("pointerup", () => { drag = null; stage.classList.remove("dragging"); });
  return {
    showStep(s) { base = s.scene.render || s.id; set(5); },
    replay() {}, setExplode() {}, setView() {}, setXray() {}, setLabels() {}, setDemo() {},
  };
}

buildNav();
go(stepFromHash(), true);
</script>

<script type="module">
/* =====================================================================
   Live 3D viewer: real STL geometry (models.js) + simple hardware models,
   animated insertion per step, orbit controls, callouts, x-ray, demo.
   ===================================================================== */
let THREE, OrbitControls, CSS2DRenderer, CSS2DObject;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  ({ CSS2DRenderer, CSS2DObject } = await import("three/addons/renderers/CSS2DRenderer.js"));
  if (!window.SPORTCAM_MODELS) throw new Error("models.js missing — run python3 docs/setup/assembly/build_models.py");
  const c = document.createElement("canvas");
  if (!(c.getContext("webgl2") || c.getContext("webgl"))) throw new Error("WebGL unavailable");
} catch (err) {
  window.dispatchEvent(new CustomEvent("viewer-failed", { detail: String(err) }));
  throw err;
}

const COL = {
  print: 0xc3ccdb, printAlt: 0xb3bdd0, white: 0xf3f3ee, black: 0x2a2e35, pcb: 0x2f7a4c, steel: 0xb3b7bd,
  dark: 0x4a4f57, brass: 0xc9a24a, blue: 0x1e4f8f, purple: 0x5b3d8a, rubber: 0x1c1c1c, wire: 0x8e2b2b,
  ffc: 0xe9e3cf, lensGlass: 0x1b3550, cream: 0xf0e4a0, tripod: 0x50555d,
};
const ACCENT = new THREE.Color(0x2f6fed);
const GREEN = 0x1f9d55;

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, flatShading: true, metalness: opts.metal ?? 0.08, roughness: opts.rough ?? 0.72,
    transparent: opts.opacity != null, opacity: opts.opacity ?? 1, side: opts.double ? THREE.DoubleSide : THREE.FrontSide });
}

/* ---- geometry helpers (OpenSCAD axes) -------------------------------- */
const box = (w, l, h) => new THREE.BoxGeometry(w, l, h);
function cyl(r, h, axis = "z", rTop) {
  const g = new THREE.CylinderGeometry(rTop ?? r, r, h, 32);
  if (axis === "z") g.rotateX(Math.PI / 2); else if (axis === "x") g.rotateZ(Math.PI / 2);
  return g;
}
function tube(ro, ri, h, axis = "z") {
  const s = new THREE.Shape(); s.absarc(0, 0, ro, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 0, ri, 0, Math.PI * 2, true); s.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 40 });
  g.translate(0, 0, -h / 2);
  if (axis === "y") g.rotateX(Math.PI / 2); else if (axis === "x") g.rotateY(Math.PI / 2);
  return g;
}
function beltGeo(R, r, d, thick, width) {
  const path = (R1, r1) => {
    const a = Math.acos((R1 - r1) / d);
    const s = new THREE.Shape();
    s.moveTo(R1 * Math.cos(a), R1 * Math.sin(a));
    s.absarc(0, 0, R1, a, Math.PI * 2 - a, false);
    s.lineTo(d + r1 * Math.cos(-a), r1 * Math.sin(-a));
    s.absarc(d, 0, r1, -a, a, false);
    s.closePath();
    return s;
  };
  const outer = path(R + thick, r + thick);
  const inner = path(R, r);
  outer.holes.push(inner);
  return new THREE.ExtrudeGeometry(outer, { depth: width, bevelEnabled: false, curveSegments: 64 });
}
function cable(points, r, color) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, r, 10, false), mat(color, { rough: 0.9 }));
  m.material.flatShading = false;
  return m;
}
function mesh(g, color, opts) { return new THREE.Mesh(g, mat(color, opts)); }
function at(m, x, y, z, rx = 0, ry = 0, rz = 0) { m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return m; }
function group(...children) { const g = new THREE.Group(); children.forEach((c) => g.add(c)); return g; }

function stlGeometry(name) {
  const d = window.SPORTCAM_MODELS[name];
  if (!d) throw new Error("model missing: " + name);
  const vb = Uint8Array.from(atob(d.v), (ch) => ch.charCodeAt(0));
  const ib = Uint8Array.from(atob(d.i), (ch) => ch.charCodeAt(0));
  const q = new Uint16Array(vb.buffer, vb.byteOffset, d.nv * 3);
  const idx = d.i32 ? new Uint32Array(ib.buffer, ib.byteOffset, d.nt * 3) : new Uint16Array(ib.buffer, ib.byteOffset, d.nt * 3);
  const pos = new Float32Array(d.nv * 3);
  for (let i = 0; i < d.nv; i++) for (let k = 0; k < 3; k++)
    pos[i * 3 + k] = d.min[k] + (q[i * 3 + k] / 65535) * (d.max[k] - d.min[k]);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  return g;
}

/* ---- parts placed by cad/fit.py ----------------------------------------
   placed(key, fn): a board from LY.boxes, drawn in its own frame (centre
   origin, z = 0 on the floor tape, +x along its length) and moved to where
   the solver put it. `mid` centres it vertically (switch, jack). */
function placed(key, fn, mid) {
  const b = LY.boxes[key], g = group(...fn(b));
  g.position.set(b.cx, b.cy, mid ? (b.z0 + b.z1) / 2 : b.z0);
  g.rotation.z = THREE.MathUtils.degToRad(b.ang);
  return g;
}
function piPlaced(fn) {   // the Pi's frame: centre origin, z = 0 under the board, +x to the USB end, −y the power edge
  const p = LY.parts.pi, g = group(...fn(p, p.l / 2, p.w / 2));
  g.position.set(LY.pi.x, LY.pi.y, LY.pi.z);
  g.rotation.z = THREE.MathUtils.degToRad(LY.pi.ang);
  return g;
}
function piPoint(x, y, z) {    // Pi-frame point → world (OpenSCAD) coordinates
  const a = LY.pi.ang * Math.PI / 180;
  return [LY.pi.x + x * Math.cos(a) - y * Math.sin(a), LY.pi.y + x * Math.sin(a) + y * Math.cos(a), LY.pi.z + z];
}

/* ---- the parts catalogue ---------------------------------------------
   build: returns an Object3D positioned at its seat in OpenSCAD coords.
   grp:   static (base), pan (turns with the platform), tilt (turns on the

  battery_tray: { grp: "static", stl: "battery_tray", color: COL.print,
                  pos: [-LY.parts.power_bank.l / 2 - 2.4, -LY.parts.power_bank.w / 2 - 2.4, LY.tray_z] },
  bank: { grp: "static", build: () => { const k = LY.parts.power_bank;
    return group(at(mesh(box(k.l, k.w, k.h), COL.dark, { rough: 0.5 }), 0, 0, LY.tray_z + 2.4 + k.h / 2),
                 at(mesh(box(26, 10, 2), COL.steel, { metal: 0.4 }), -k.l / 2 + 5, 0, LY.tray_z + 2.4 + k.h)); } },

  // the shelf, with the LED ring under it and the Pi on top
  shelf: { grp: "static", stl: "shelf", color: COL.white, pos: [0, 0, SHELF_Z] },
  ledring: { grp: "static", build: () => {

  shifter: { grp: "static", build: () => placed("shifter", (b) => [
      at(mesh(box(b.l, b.w, 1.6), COL.pcb), 0, 0, 0.8),

  pi: { grp: "static", build: () => piPlaced((p, hl, hw) => [
      at(mesh(box(p.l, p.w, 1.6), COL.pcb), 0, 0, 0.8),
      at(mesh(box(p.gpio_x1 - p.gpio_x0, 5, 8.5), COL.black), (p.gpio_x0 + p.gpio_x1) / 2 - hl, hw - 3.5, 5.85),
      at(mesh(box(17.5, 13, 15.6), COL.steel, { metal: 0.4 }), hl + p.port_overhang - 8.75, -hw + 9, 9.4),
      at(mesh(box(17.5, 13, 15.6), COL.steel, { metal: 0.4 }), hl + p.port_overhang - 8.75, -hw + 27, 9.4),

  cooler: { grp: "static", build: () => piPlaced((p, hl, hw) => [
      at(mesh(box(15, 15, p.heatsink_h), COL.dark, { metal: 0.3 }), 29 - hl, -hw + 32, 1.6 + p.heatsink_h / 2),
      at(mesh(box(10, 14, p.heatsink_h * 0.7), COL.dark, { metal: 0.3 }), 45 - hl, -hw + 32, 1.6 + p.heatsink_h * 0.35)]) },
  led_diffuser_ring: { grp: "static", stl: "led_diffuser_ring", color: COL.white, opacity: 0.82, pos: [0, 0, BAND_Z] },

  // lid and the bought PTZ assembly
  lid: { grp: "static", stl: "lid", color: COL.print, pos: [0, 0, LID_Z] },
  ptz_plate: { grp: "static", build: () => group(at(mesh(box(56, 56, 6), COL.steel, { metal: 0.55, rough: 0.45 }), 0, 0, LID_TOP + 3),
                                                 at(mesh(cyl(21, 4), COL.dark), 0, 0, LID_TOP + 8)) },
  ptz_pan: { grp: "pan", build: () => group(at(mesh(cyl(22, 16), COL.steel, { metal: 0.55, rough: 0.45 }), 0, 0, LID_TOP + 16),
                                            at(mesh(box(44, 30, 4), COL.steel, { metal: 0.55 }), 0, 0, LID_TOP + 26)) },
  ptz_yoke: { grp: "pan", build: () => group(
      at(mesh(box(26, 4, 42), COL.steel, { metal: 0.55, rough: 0.45 }), 0, 26, LID_TOP + 47),
      at(mesh(box(26, 4, 42), COL.steel, { metal: 0.55, rough: 0.45 }), 0, -26, LID_TOP + 47),
      at(mesh(box(22, 20, 18), COL.black), 0, 30, TILT_Z)) },
  camera: { grp: "tilt", build: () => group(at(mesh(box(4, 38, 38), COL.pcb), 4, 0, TILT_Z),
                                            at(mesh(box(2, 26, 26), COL.black), 7, 0, TILT_Z)) },
  lens: { grp: "tilt", build: () => group(at(mesh(cyl(18, 42, "x"), COL.black, { rough: 0.6 }), 31, 0, TILT_Z),
                                          at(mesh(tube(18.5, 16, 4, "x"), COL.dark), 48, 0, TILT_Z),
                                          at(mesh(cyl(13.5, 1.2, "x"), COL.lensGlass, { metal: 0.5, rough: 0.2 }), 53, 0, TILT_Z)) },

  // cabling
  ffc: { grp: "static", build: () => { const p = LY.parts.pi, c = piPoint(45 - p.l / 2, -p.w / 2 + 16, 8);
    return cable([[6, 0, TILT_Z - 16], [14, 10, LID_Z + 20], [4, 8, LID_Z - 4], [-6, 6, LID_Z - 10], [c[0], c[1], c[2] + 12], c], 1.6, COL.ffc); } },
  pwr_pi: { grp: "static", build: () => {
    const p = LY.parts.pi, u = [Math.cos(LY.gap_ang * Math.PI / 180), Math.sin(LY.gap_ang * Math.PI / 180)];
    const gp = [u[0] * (LY.gap_d + 8), u[1] * (LY.gap_d + 8)], plug = piPoint(p.usbc_x - p.l / 2, -p.w / 2 - 12, 3);
    const B = bx("buck"), G = bx("gauge"), T = bx("trigger");
    return group(cable([[B.cx, B.cy, B.z1], [gp[0], gp[1], (B.z1 + SHELF_Z) / 2], [gp[0], gp[1], LY.shelf_top + 2], plug], 2.2, COL.wire),
                 cable([[T.cx, T.cy, T.z1], [G.cx, G.cy, G.z1 + 2], [B.cx, B.cy, B.z1 - 4]], 2.0, COL.wire));
  } },
  i2c_lead: { grp: "static", build: () => {
    const p = LY.parts.pi, u = [Math.cos(LY.gap_ang * Math.PI / 180), Math.sin(LY.gap_ang * Math.PI / 180)];
    const G = bx("gauge"), hdr = piPoint(p.gpio_x0 + 6 - p.l / 2, p.w / 2 - 3.5, 10);
    return cable([[G.cx, G.cy, G.z1], [u[0] * (LY.gap_d + 4), u[1] * (LY.gap_d + 4), SHELF_Z - 4], [u[0] * (LY.gap_d + 4), u[1] * (LY.gap_d + 4), LY.shelf_top + 6], hdr], 1.4, COL.dark);
  } },
};

/* ---- scene ------------------------------------------------------------ */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xf3f5f9);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.className = "labels";
stage.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f5f9);
const camera = new THREE.PerspectiveCamera(38, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.1;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8e96a6, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(260, 420, 180);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 10, far: 1500 });
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5); fill.position.set(-300, 160, -220); scene.add(fill);

const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; scene.add(root);   // OpenSCAD Z-up → three Y-up
const groups = { static: new THREE.Group(), pan: new THREE.Group(), tilt: new THREE.Group() };
root.add(groups.static); root.add(groups.pan);
const tiltPivot = new THREE.Group(); tiltPivot.position.set(0, 0, TILT_Z); groups.pan.add(tiltPivot);
groups.tilt.position.set(0, 0, -TILT_Z); tiltPivot.add(groups.tilt);
const overlay = new THREE.Group(); root.add(overlay);      // arrows, leader lines
const labelsGroup = new THREE.Group(); root.add(labelsGroup);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.ShadowMaterial({ opacity: 0.12 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(1200, 24, 0xd5dbe6, 0xe4e8f0); grid.position.y = -0.5; scene.add(grid);

const built = {};  // id -> { obj, seat: Vector3, mats: Material[], box: Box3 (local, at seat) }
function build(id) {
  if (built[id]) return built[id];
  const def = PARTS[id];
  let obj;
  if (def.stl) {
    obj = new THREE.Mesh(stlGeometry(def.stl), mat(def.color, { opacity: def.opacity, double: def.double }));
    if (def.pos) obj.position.set(...def.pos);
    if (def.rot) obj.rotation.set(...def.rot);
    // wrap so explode offsets apply in group space without disturbing the part's own transform
    const w = new THREE.Group(); w.add(obj); obj = w;
  } else {
    obj = def.build();
  }
  const mats = [];
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; mats.push(o.material); o.material.userData.base = { opacity: o.material.opacity, transparent: o.material.transparent, depthWrite: o.material.depthWrite }; } });
  groups[def.grp].add(obj);
  obj.updateWorldMatrix(true, true);
  const bb = new THREE.Box3().setFromObject(obj);  // world (three) coords at seat
  const rec = { obj, seat: obj.position.clone(), mats, box: bb, def };
  built[id] = rec;
  obj.visible = false;
  return rec;
}

/* ---- step state -------------------------------------------------------- */
const VIEWS = {    // direction from target to camera, OpenSCAD coords (x, y, z-up)
  "iso": [1.25, -1.1, 0.85], "iso-high": [1.1, -1.0, 1.4], "iso-low": [1.25, -1.1, 0.45], "iso-back": [-1.2, -1.1, 0.9],
  "front": [1, 0.05, 0.3], "front-high": [1, -0.25, 0.7], "side": [0.05, -1, 0.3], "side-low": [0.3, -1, 0.12],
  "top": [0.15, -0.25, 1], "under": [0.9, -0.8, -0.9], "under-iso": [1.1, -1.0, -0.75],
};
const toThree = (v) => new THREE.Vector3(v[0], v[2], -v[1]);
let stepState = null;   // { adds: [{rec, explode: Vector3}], box, focusBox, arrows: [] , t, anim }
let labelsOn = true, xray = false, demo = false, demoT = 0;
const camTween = { active: false };

const arrowMat = new THREE.MeshBasicMaterial({ color: GREEN, depthTest: false, transparent: true, opacity: 0.95 });
function makeArrow(from, dir, len) {
  const head = Math.min(16, len * 0.4), shaft = Math.max(1, len - head);
  const g = new THREE.Group();
  const s = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, shaft, 12), arrowMat); s.position.y = shaft / 2;
  const h = new THREE.Mesh(new THREE.ConeGeometry(5, head, 16), arrowMat); h.position.y = shaft + head / 2;
  g.add(s, h); g.renderOrder = 999;
  g.position.copy(from);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  return g;
}

function clearOverlay() {
  overlay.clear(); labelsGroup.traverse((o) => { if (o.isCSS2DObject && o.element.parentNode) o.element.remove(); }); labelsGroup.clear();
}

function showStep(step) {
  const sc = step.scene;
  const show = new Set(sc.show);
  const adds = sc.add.map(([id, ex, ey, ez]) => ({ rec: build(id), explode: new THREE.Vector3(ex, ey, ez) }));
  const addIds = new Set(sc.add.map((a) => a[0]));
  // visibility + materials
  for (const id in built) {
    const r = built[id];
    const vis = show.has(id) || addIds.has(id);
    r.obj.visible = vis;
    r.obj.position.copy(r.seat);
    r.mats.forEach((m) => { m.emissive.setHex(0x000000); m.emissiveIntensity = 0; });
  }
  for (const id of show) build(id).obj.visible = true;
  clearOverlay();
  // bounds
  const box = new THREE.Box3();
  const focusBox = new THREE.Box3();
  for (const id of show) box.union(built[id].box);
  for (const a of adds) {
    box.union(a.rec.box);
    const ex = a.rec.box.clone().translate(toThree(a.explode.toArray()));
    box.union(ex); focusBox.union(a.rec.box); focusBox.union(ex);
  }
  if (focusBox.isEmpty()) focusBox.copy(box);
  // insertion arrows: solid, drawn on top, sitting in the gap between the
  // exploded part and its seat (one per distinct explode vector / part)
  const arrows = [];
  if (sc.arrows !== false) for (const a of adds) {
    if (a.explode.lengthSq() < 1) continue;
    const c = a.rec.box.getCenter(new THREE.Vector3());               // three coords
    const seatCenter = new THREE.Vector3(c.x, -c.z, c.y);             // back to OpenSCAD
    const from = seatCenter.clone().addScaledVector(a.explode, 0.78);
    const ar = makeArrow(from, a.explode.clone().negate().normalize(), a.explode.length() * 0.56);
    overlay.add(ar); arrows.push(ar);
  }
  // callouts
  for (const [x, y, z, text, ox = 0, oy = 0, oz = 40] of (sc.marks || [])) {
    const p = new THREE.Vector3(x, y, z), q = new THREE.Vector3(x + ox, y + oy, z + oz);
    overlay.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p, q]), new THREE.LineBasicMaterial({ color: GREEN })));
    overlay.add(at(new THREE.Mesh(new THREE.SphereGeometry(2.2, 12, 12), new THREE.MeshBasicMaterial({ color: GREEN })), x, y, z));
    const el = document.createElement("div"); el.className = "callout"; el.textContent = text;
    const lab = new CSS2DObject(el); lab.position.copy(q); labelsGroup.add(lab);
  }
  labelsGroup.visible = labelsOn;
  stepState = { adds, box, focusBox, arrows, t: 0, anim: null, focus: sc.focus, focusPad: sc.focusPad ?? 45, view: sc.view || "iso" };
  setXray(!!sc.xray, true);          // each step starts with its own default; the button overrides per step
  setDemo(false, true);
  document.getElementById("btnDemo").classList.remove("on");
  document.getElementById("btnDemo").textContent = "▶ Motion demo";
  applyExplode(0);
  fitView(stepState.view, true);
  if (!sc.stay) replay();
}

function applyExplode(t) {   // t: 0 exploded … 1 assembled
  if (!stepState) return;
  stepState.t = t;
  const e = 1 - (1 - Math.cos(Math.PI * t)) / 2;   // ease-in-out
  for (const a of stepState.adds) a.rec.obj.position.copy(a.rec.seat).addScaledVector(a.explode, e);
  for (const ar of stepState.arrows) ar.visible = t < 0.985;
  document.getElementById("explode").value = Math.round(t * 1000);
}
function replay() {
  if (!stepState) return;
  const start = performance.now() + 350, dur = 1500;
  stepState.anim = (now) => {
    const t = Math.max(0, Math.min(1, (now - start) / dur));
    applyExplode(t);
    if (t >= 1) stepState.anim = null;
  };
}
function setExplode(t) { if (stepState) { stepState.anim = null; applyExplode(t); } }

function fitView(name, immediate) {
  if (!stepState) return;
  const b = stepState.focus === "add" ? stepState.focusBox.clone().expandByScalar(stepState.focusPad) : stepState.box;
  const center = b.getCenter(new THREE.Vector3());
  const dir = toThree(Array.isArray(name) ? name : (VIEWS[name] || VIEWS.iso)).normalize();
  // Fit the box's eight corners inside the frustum for this view direction
  // (a bounding sphere wastes a third of the frame on flat assemblies).
  const z = dir.clone(), up = new THREE.Vector3(0, 1, 0);
  const x = new THREE.Vector3().crossVectors(up, z); if (x.lengthSq() < 1e-6) x.set(1, 0, 0); x.normalize();
  const y = new THREE.Vector3().crossVectors(z, x);
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), th = tv * camera.aspect;
  let dist = 60;
  for (let i = 0; i < 8; i++) {
    const c = new THREE.Vector3(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).sub(center);
    const pz = c.dot(z);
    dist = Math.max(dist, pz + Math.abs(c.dot(x)) / th, pz + Math.abs(c.dot(y)) / tv);
  }
  dist *= 1.1;
  const pos = center.clone().addScaledVector(dir, dist);
  camera.near = Math.max(1, dist / 100); camera.far = dist * 10 + 3000; camera.updateProjectionMatrix();
  if (immediate && !camTween.active && !camTween.done) { camera.position.copy(pos); controls.target.copy(center); camTween.done = true; return; }
  Object.assign(camTween, { active: true, t0: performance.now(), dur: 750, p0: camera.position.clone(), p1: pos, c0: controls.target.clone(), c1: center });
}
function setView(name) { fitView(name, false); }

function setXray(on, silent) {
  xray = on;
  if (!stepState) return;
  const addSet = new Set(stepState.adds.map((a) => a.rec));
  for (const id in built) {
    const r = built[id];
    const ghost = on && !addSet.has(r);
    r.mats.forEach((m) => {
      const b = m.userData.base;
      m.transparent = ghost || b.transparent; m.opacity = ghost ? Math.min(0.22, b.opacity) : b.opacity; m.depthWrite = ghost ? false : b.depthWrite;
      m.needsUpdate = true;
    });
  }
  if (!silent) document.getElementById("btnXray").classList.toggle("on", on);
}
function setLabels(on) { labelsOn = on; labelsGroup.visible = on; }
function setDemo(on) { demo = on; if (!on) { demoT = 0; } }


/* ---- catalogue snapshots ---------------------------------------------
   A still picture of one or more PARTS models on their own, for the
   parts-and-tools popup (docs/setup/assembly/catalog.js). */
let snapRenderer = null;
function snapshot(ids) {
  ids = ids.filter((id) => PARTS[id]);
  if (!ids.length) return null;
  if (!snapRenderer) {
    snapRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    snapRenderer.setPixelRatio(1); snapRenderer.setSize(640, 400); snapRenderer.setClearColor(0xf3f5f9);
  }
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x8e96a6, 1.3));
  const kl = new THREE.DirectionalLight(0xffffff, 1.5); kl.position.set(260, 420, 180); sc.add(kl);
  const r = new THREE.Group(); r.rotation.x = -Math.PI / 2; sc.add(r);
  for (const id of ids) {
    const def = PARTS[id];
    let obj;
    if (def.stl) {
      obj = new THREE.Mesh(stlGeometry(def.stl), mat(def.color, { double: def.double }));
      if (def.pos) obj.position.set(...def.pos);
      if (def.rot) obj.rotation.set(...def.rot);
    } else obj = def.build();
    r.add(obj);
  }
  r.updateWorldMatrix(true, true);
  const sphere = new THREE.Box3().setFromObject(r).getBoundingSphere(new THREE.Sphere());
  const cam = new THREE.PerspectiveCamera(30, 640 / 400, 1, 10000);
  const dir = toThree(VIEWS.iso).normalize();
  const dist = Math.max(20, sphere.radius) / Math.sin(THREE.MathUtils.degToRad(15)) * 1.05;
  cam.position.copy(sphere.center).addScaledVector(dir, dist); cam.lookAt(sphere.center);
  cam.near = dist / 100; cam.far = dist * 4; cam.updateProjectionMatrix();
  snapRenderer.render(sc, cam);
  const url = snapRenderer.domElement.toDataURL("image/png");
  sc.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  return url;
}

/* ---- loop -------------------------------------------------------------- */
function resize() {
  const w = stage.clientWidth, h = Math.max(300, Math.round(w * 0.68));
  stage.style.height = h + "px";
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (stepState && stepState.anim) stepState.anim(now);
  if (camTween.active) {
    const u = Math.min(1, (now - camTween.t0) / camTween.dur), e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.c0, camTween.c1, e);
    if (u >= 1) camTween.active = false;
  }
  // highlight pulse on this step's parts
  if (stepState) {
    const k = 0.32 + 0.22 * Math.sin(now / 320);
    for (const a of stepState.adds) a.rec.mats.forEach((m) => { m.emissive.copy(ACCENT); m.emissiveIntensity = k; });
  }
  // motion demo
  // Demo sweeps between the soft limits — this axis does not rotate continuously.
  if (demo) {
    demoT += dt;
    groups.pan.rotation.z = THREE.MathUtils.degToRad(80) * Math.sin(demoT * 0.5);
    tiltPivot.rotation.y = -THREE.MathUtils.degToRad(32) * Math.sin(demoT * 0.8) + THREE.MathUtils.degToRad(12);
  }
  else { groups.pan.rotation.z *= 0.9; tiltPivot.rotation.y *= 0.9; }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
requestAnimationFrame(frame);

window.dispatchEvent(new CustomEvent("viewer-ready", { detail: { showStep, replay, setExplode, setView, setXray, setLabels, setDemo, snapshot } }));
</script>
</body>
</html>
