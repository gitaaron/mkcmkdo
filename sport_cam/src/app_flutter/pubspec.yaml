name: sportcam
description: SportCam companion app — discovers the camera over mDNS and connects directly for live video and control.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # mDNS/Bonjour discovery — the reason this app is native: browsers cannot
  # do service discovery at all.
  multicast_dns: ^0.3.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  # native players: ExoPlayer (Android) / AVPlayer (iOS) for recordings
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  # SHA-256 of the session secrets, to tell whose session is running
  crypto: ^3.0.3
  # recording start/stop chimes, and the silent loop that keeps iOS awake
  audioplayers: ^6.8.1
  # Android foreground service, so the chimes still play in the background
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
