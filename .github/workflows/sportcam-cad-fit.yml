# Re-run the SportCam fit audit whenever the CAD or the bought-part sizes change.
# It fails if any part doesn't fit, if the committed layout/STLs are stale, or
# if a printed part's mesh intersects a bought part (OpenSCAD, --deep).
name: SportCam CAD fit

on:
  push:
    paths:
      - "sport_cam/cad/**"
      - "sport_cam/*/cad/**"
      - "sport_cam/*/device/sportcam/config.py"
  pull_request:
    paths:
      - "sport_cam/cad/**"
      - "sport_cam/*/cad/**"
      - "sport_cam/*/device/sportcam/config.py"

jobs:
  fit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad
      - name: Fit check
        run: python3 sport_cam/cad/fit.py --check --deep
